<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>CS 1.6 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Arial', sans-serif; user-select: none; color: #fff; }
  canvas { display: block; }

  #crosshair {
    position: fixed; top: 50%; left: 50%; width: 22px; height: 22px;
    margin: -11px 0 0 -11px; pointer-events: none; z-index: 10;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #0f0;
    box-shadow: 0 0 4px #0f0;
  }
  #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #crosshair::after  { top: 10px; left: 0; height: 2px; width: 22px; }

  #hud {
    position: fixed; bottom: 20px; left: 30px; z-index: 10;
    display: flex; gap: 40px; align-items: flex-end;
    pointer-events: none; text-shadow: 2px 2px 4px #000;
  }
  #hud .stat { display: flex; align-items: baseline; gap: 8px; }
  #hud .icon { font-size: 24px; }
  #hud .hp-num { font-size: 42px; font-weight: bold; color: #fff; }
  #hud .hp-num.low { color: #f33; }
  #hud .hp-bar {
    width: 100px; height: 8px; background: rgba(0,0,0,0.6);
    border: 1px solid #444; margin-top: 4px;
  }
  #hud .hp-fill {
    height: 100%; background: linear-gradient(90deg, #f33, #0f0); width: 100%;
    transition: width 0.2s;
  }
  #hud .ammo-num { font-size: 42px; font-weight: bold; color: #fff; }
  #hud .ammo-max { font-size: 22px; color: #888; }
  #hud .weapon-name {
    font-size: 14px; color: #ffa; margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: 1px;
  }
  #hud .stats { flex-direction: column; align-items: flex-start; display: flex; }
  #hud .bottom-row { display: flex; align-items: baseline; gap: 8px; }

  #damage-flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(circle, transparent 40%, rgba(255,0,0,0.7));
    opacity: 0; transition: opacity 0.15s;
  }
  #hit-marker {
    position: fixed; top: 50%; left: 50%; width: 30px; height: 30px;
    margin: -15px 0 0 -15px; pointer-events: none; opacity: 0; z-index: 6;
  }
  #hit-marker::before, #hit-marker::after {
    content: ''; position: absolute; background: #f00;
    box-shadow: 0 0 6px #f00;
  }
  #hit-marker::before { left: 14px; top: 0; width: 2px; height: 30px; transform: rotate(45deg); }
  #hit-marker::after  { left: 14px; top: 0; width: 2px; height: 30px; transform: rotate(-45deg); }

  #kill-feed {
    position: fixed; top: 20px; right: 20px; z-index: 10;
    font-size: 14px; text-align: right;
  }
  #kill-feed div {
    background: rgba(0,0,0,0.7); padding: 6px 12px; margin-bottom: 4px;
    border-left: 3px solid #ffa; animation: fadeIn 0.2s;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateX(20px); } }

  #score {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    background: rgba(0,0,0,0.7); padding: 10px 18px; border-radius: 4px;
    font-size: 18px; border-left: 3px solid #ffa;
  }
  #score .num { color: #ffa; font-weight: bold; font-size: 24px; }

  #blocker {
    position: fixed; inset: 0; z-index: 100; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle, #2a2a2a, #000);
    cursor: pointer; text-align: center;
  }
  #blocker h1 {
    font-size: 72px; letter-spacing: 10px; margin-bottom: 10px;
    color: #fff; text-shadow: 0 0 30px #f80, 4px 4px 0 #000;
    font-family: 'Impact', sans-serif;
  }
  #blocker .sub { color: #ffa; font-size: 20px; margin-bottom: 40px; letter-spacing: 4px; }
  #blocker .cta {
    font-size: 28px; color: #fff; padding: 18px 50px;
    border: 3px solid #f80; background: rgba(255,136,0,0.15);
    letter-spacing: 3px; animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 50% { background: rgba(255,136,0,0.4); } }
  #blocker.hidden { display: none; }

  #reloading {
    position: fixed; top: 55%; left: 50%; transform: translateX(-50%);
    color: #ffa; font-size: 22px; letter-spacing: 3px;
    display: none; z-index: 10; text-shadow: 2px 2px 4px #000;
  }
</style>
</head>
<body>

<div id="crosshair"></div>
<div id="damage-flash"></div>
<div id="hit-marker"></div>
<div id="reloading">ПЕРЕЗАРЯДКА...</div>

<div id="score">СЧЁТ: <span class="num" id="score-num">0</span></div>

<div id="hud">

    <div class="weapon-name" id="weapon-name">AK-47</div>
    <div class="bottom-row">
      <span class="icon">🔫</span>
      <span class="ammo-num" id="ammo-cur">30</span>

    </div>
  </div>
  <div class="stats">
    <div class="hp-num" id="hp-num">100</div>
    <div class="hp-bar"><div class="hp-fill" id="hp-fill"></div></div>

</div>

<div id="blocker">
  <h1>COUNTER-STRIKE</h1>
  <div class="sub">1.6 · 3D</div>
  <div class="cta">НАЖМИ ЧТОБЫ ИГРАТЬ</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';

// ============================================================
//  АУДИО СИСТЕМА
// ============================================================
const Sound = {
  ctx: null, master: null,
  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.35;
      this.master.connect(this.ctx.destination);
    } catch(e) {}
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  noise(dur) {
    const sr = this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, Math.max(1, sr*dur), sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
    return buf;
  },
  shot(type = 'rifle') {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const cfg = {
      rifle:  { lp: 900,  dur: 0.15, gain: 0.7, low: 180 },
      pistol: { lp: 1500, dur: 0.10, gain: 0.5, low: 220 },
      shotgun:{ lp: 600,  dur: 0.25, gain: 0.9, low: 100 },
      smg:    { lp: 1200, dur: 0.08, gain: 0.5, low: 200 },
      sniper: { lp: 700,  dur: 0.30, gain: 1.0, low: 80  }
    }[type] || { lp: 1000, dur: 0.12, gain: 0.6, low: 150 };

    const s = this.ctx.createBufferSource(); s.buffer = this.noise(cfg.dur);
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cfg.lp;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(cfg.gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + cfg.dur);
    s.connect(f).connect(g).connect(this.master); s.start(t);

    const o = this.ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(cfg.low, t);
    o.frequency.exponentialRampToValueAtTime(30, t + cfg.dur*0.7);
    const og = this.ctx.createGain();
    og.gain.setValueAtTime(cfg.gain*0.7, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + cfg.dur*0.8);
    o.connect(og).connect(this.master); o.start(t); o.stop(t + cfg.dur);

    // Металлический "щелчок"
    const click = this.ctx.createBufferSource(); click.buffer = this.noise(0.03);
    const cf = this.ctx.createBiquadFilter(); cf.type='highpass'; cf.frequency.value=3500;
    const cg = this.ctx.createGain();
    cg.gain.setValueAtTime(0.3, t + 0.01);
    cg.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    click.connect(cf).connect(cg).connect(this.master); click.start(t + 0.01);
  },
  reloadClick() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const s = this.ctx.createBufferSource(); s.buffer = this.noise(0.05);
    const f = this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1800;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.05);
    s.connect(f).connect(g).connect(this.master); s.start(t);
  },
  reload() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.reloadClick();
    setTimeout(() => this.reloadClick(), 300);
    setTimeout(() => this.reloadClick(), 700);
  },
  empty() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const s = this.ctx.createBufferSource(); s.buffer = this.noise(0.04);
    const f = this.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=4000;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.04);
    s.connect(f).connect(g).connect(this.master); s.start(t);
  },
  hit() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type='square';
    o.frequency.setValueAtTime(800, t);
    o.frequency.exponentialRampToValueAtTime(400, t+0.08);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.1);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+0.1);
  },
  headshot() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(1600, t);
    o.frequency.exponentialRampToValueAtTime(2200, t+0.1);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.15);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+0.15);
  },
  enemyShot() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const s = this.ctx.createBufferSource(); s.buffer = this.noise(0.12);
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=700;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.15);
    s.connect(f).connect(g).connect(this.master); s.start(t);
  },
  death() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(400, t);
    o.frequency.exponentialRampToValueAtTime(60, t+0.6);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.7);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+0.7);
  },
  hurt() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(200, t);
    o.frequency.exponentialRampToValueAtTime(80, t+0.2);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.25);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+0.25);
  }
};

// ============================================================
//  THREE.JS
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc8b088);
scene.fog = new THREE.Fog(0xc8b088, 30, 140);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.05, 500);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffe4b5, 0.5));
scene.add(new THREE.HemisphereLight(0xffe4b5, 0x554433, 0.6));

const sun = new THREE.DirectionalLight(0xffeecc, 1.5);
sun.position.set(60, 80, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -80; sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80; sun.shadow.camera.bottom = -80;
sun.shadow.camera.far = 200;
sun.shadow.bias = -0.0003;
scene.add(sun);

// ============================================================
//  UHD ТЕКСТУРЫ (процедурные, детальные)
// ============================================================
function makeTexture(base, opts = {}) {
  const {
    noise = 25, size = 512, pattern = null, repeat = [1,1],
    scratches = 0, stains = 0, grain = 0
  } = opts;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');

  ctx.fillStyle = base;
  ctx.fillRect(0, 0, size, size);

  // Основной шум
  const img = ctx.getImageData(0, 0, size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * noise;
    img.data[i]   = Math.max(0, Math.min(255, img.data[i]   + n));
    img.data[i+1] = Math.max(0, Math.min(255, img.data[i+1] + n));
    img.data[i+2] = Math.max(0, Math.min(255, img.data[i+2] + n));
  }
  ctx.putImageData(img, 0, 0);

  // Пятна
  if (stains > 0) {
    for (let i = 0; i < stains; i++) {
      const x = Math.random() * size;
      const y = Math.random() * size;
      const r = 10 + Math.random() * 40;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
      const dark = Math.random() > 0.5;
      grad.addColorStop(0, dark ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.15)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Царапины
  if (scratches > 0) {
    for (let i = 0; i < scratches; i++) {
      ctx.strokeStyle = `rgba(${Math.random()>0.5?'255,255,255':'0,0,0'},${0.05 + Math.random()*0.15})`;
      ctx.lineWidth = 0.5 + Math.random() * 1.5;
      ctx.beginPath();
      const x = Math.random() * size;
      const y = Math.random() * size;
      const len = 20 + Math.random() * 100;
      const ang = Math.random() * Math.PI * 2;
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
      ctx.stroke();
    }
  }

  // Песок / трава
  if (pattern === 'grass') {
    for (let i = 0; i < 800; i++) {
      const x = Math.random() * size;
      const y = Math.random() * size;
      const h = 2 + Math.random() * 6;
      ctx.strokeStyle = `rgba(${30+Math.random()*60},${80+Math.random()*80},${30+Math.random()*40},${0.3+Math.random()*0.4})`;
      ctx.lineWidth = 0.5 + Math.random();
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + (Math.random()-0.5)*3, y - h);
      ctx.stroke();
    }
  } else if (pattern === 'sand') {
    for (let i = 0; i < 1500; i++) {
      ctx.fillStyle = `rgba(${200+Math.random()*40},${170+Math.random()*30},${120+Math.random()*30},${0.2+Math.random()*0.4})`;
      ctx.fillRect(Math.random()*size, Math.random()*size, 1+Math.random()*2, 1+Math.random()*2);
    }
  } else if (pattern === 'brick') {
    const bh = size / 8;
    const bw = size / 4;
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 3;
    for (let y = 0; y < size; y += bh) {
      const off = (y / bh) % 2 ? bw / 2 : 0;
      for (let x = -bw; x < size + bw; x += bw) {
        ctx.strokeRect(x + off + 2, y + 2, bw - 4, bh - 4);
        // Затемнение на кирпиче
        if (Math.random() > 0.7) {
          ctx.fillStyle = `rgba(0,0,0,${0.1 + Math.random()*0.2})`;
          ctx.fillRect(x + off + 2, y + 2, bw - 4, bh - 4);
        }
      }
    }
  } else if (pattern === 'wood') {
    for (let i = 0; i < 60; i++) {
      ctx.strokeStyle = `rgba(${40+Math.random()*30},${20+Math.random()*20},${10+Math.random()*10},${0.2 + Math.random()*0.4})`;
      ctx.lineWidth = 1 + Math.random() * 3;
      ctx.beginPath();
      const y = Math.random() * size;
      ctx.moveTo(0, y);
      ctx.bezierCurveTo(size/3, y + (Math.random()-0.5)*30, 2*size/3, y + (Math.random()-0.5)*30, size, y + (Math.random()-0.5)*10);
      ctx.stroke();
    }
  } else if (pattern === 'metal') {
    for (let i = 0; i < 80; i++) {
      ctx.strokeStyle = `rgba(255,255,255,${0.03 + Math.random()*0.08})`;
      ctx.lineWidth = 0.5 + Math.random() * 2;
      ctx.beginPath();
      const y = Math.random() * size;
      ctx.moveTo(0, y);
      ctx.lineTo(size, y + (Math.random()-0.5)*10);
      ctx.stroke();
    }
    // Заклёпки
    for (let i = 0; i < 40; i++) {
      const x = Math.random() * size;
      const y = Math.random() * size;
      const r = 2 + Math.random() * 3;
      const grad = ctx.createRadialGradient(x - r/2, y - r/2, 0, x, y, r);
      grad.addColorStop(0, 'rgba(255,255,255,0.6)');
      grad.addColorStop(0.5, 'rgba(180,180,180,0.3)');
      grad.addColorStop(1, 'rgba(0,0,0,0.4)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (pattern === 'concrete') {
    for (let i = 0; i < 300; i++) {
      ctx.fillStyle = `rgba(${Math.random()>0.5?'255,255,255':'0,0,0'},${0.02 + Math.random()*0.08})`;
      const r = 1 + Math.random() * 4;
      ctx.beginPath();
      ctx.arc(Math.random()*size, Math.random()*size, r, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (pattern === 'crate') {
    ctx.strokeStyle = 'rgba(40,20,5,0.7)';
    ctx.lineWidth = 6;
    ctx.strokeRect(4, 4, size-8, size-8);
    ctx.lineWidth = 3;
    // Диагонали
    ctx.beginPath();
    ctx.moveTo(4, 4); ctx.lineTo(size-4, size-4);
    ctx.moveTo(size-4, 4); ctx.lineTo(4, size-4);
    ctx.stroke();
    // Горизонтальные планки
    ctx.lineWidth = 8;
    for (let i = 1; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(4, i * size / 4);
      ctx.lineTo(size-4, i * size / 4);
      ctx.stroke();
    }
    // Болты по углам
    for (const [bx, by] of [[12,12],[size-12,12],[12,size-12],[size-12,size-12]]) {
      const grad = ctx.createRadialGradient(bx-2, by-2, 0, bx, by, 6);
      grad.addColorStop(0, 'rgba(200,200,200,0.9)');
      grad.addColorStop(1, 'rgba(20,10,0,0.8)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(bx, by, 6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeat[0], repeat[1]);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// Генерим все текстуры UHD
const sandTex    = makeTexture('#c2a878', { pattern:'sand',     noise: 20, repeat: [40,40], stains: 20 });
const brickTex   = makeTexture('#8a5a3c', { pattern:'brick',    noise: 25, repeat: [3,1],  stains: 15, scratches: 10 });
const brickTex2  = makeTexture('#9a6a4a', { pattern:'brick',    noise: 25, repeat: [2,2],  stains: 20 });
const woodTex    = makeTexture('#8a5a30', { pattern:'wood',     noise: 30, repeat: [1,1],  scratches: 20 });
const crateTex   = makeTexture('#a0784a', { pattern:'crate',    noise: 20, repeat: [1,1] });
const metalTex   = makeTexture('#6a6a72', { pattern:'metal',    noise: 15, repeat: [2,2],  scratches: 15 });
const concreteTx = makeTexture('#a8a8a0', { pattern:'concrete', noise: 20, repeat: [4,4],  stains: 25 });
const grassTex   = makeTexture('#4a7a3a', { pattern:'grass',    noise: 30, repeat: [30,30] });
const roofTex    = makeTexture('#5a3a1a', { pattern:'wood',     noise: 35, repeat: [4,4] });

// Материалы
const sandMat     = new THREE.MeshStandardMaterial({ map: sandTex,    roughness: 0.95 });
const brickMat    = new THREE.MeshStandardMaterial({ map: brickTex,   roughness: 0.92 });
const brickMat2   = new THREE.MeshStandardMaterial({ map: brickTex2,  roughness: 0.92 });

function addBox(x, y, z, w, h, d, mat, collide = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  world.add(m);
  if (collide) {
    collidables.push({
      min: new THREE.Vector3(x-w/2, y-h/2, z-d/2),
      max: new THREE.Vector3(x+w/2, y+h/2, z+d/2)
    });
  }
  return m;
}

function buildWeaponMesh(w) {
  const g = new THREE.Group();

  // Основное тело
  const bodyMat = new THREE.MeshStandardMaterial({ color: w.color, roughness: 0.6, metalness: 0.4 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(w.bodySize[0], w.bodySize[1], w.bodySize[2]), bodyMat);
  body.castShadow = true;
  g.add(body);

  // Ствол
  const barrelMat = new THREE.MeshStandardMaterial({ color: w.barrelColor, roughness: 0.4, metalness: 0.8 });
  const barrel = new THREE.Mesh(
    new THREE.CylinderGeometry(w.bodySize[0]*0.4, w.bodySize[0]*0.4, w.barrelLen, 8),
    barrelMat
  );
  barrel.rotation.x = Math.PI / 2;
  barrel.position.z = -(w.bodySize[2]/2 + w.barrelLen/2);
  barrel.castShadow = true;
  g.add(barrel);

  // Магазин
  const mag = new THREE.Mesh(
    new THREE.BoxGeometry(w.bodySize[0]*0.7, w.bodySize[1]*0.9, w.bodySize[0]*0.5),
    bodyMat
  );
  mag.position.y = -w.bodySize[1]*0.9;
  mag.position.z = -w.bodySize[2]*0.1;
  g.add(mag);

  // Рукоятка
  const grip = new THREE.Mesh(
    new THREE.BoxGeometry(w.bodySize[0]*0.6, w.bodySize[1]*1.2, w.bodySize[0]*0.5),
    bodyMat
  );
  grip.position.y = -w.bodySize[1]*0.9;
  grip.position.z = w.bodySize[2]*0.25;
  grip.rotation.x = 0.2;
  g.add(grip);

  // Прицел / мушка
  const sight = new THREE.Mesh(
    new THREE.BoxGeometry(0.015, 0.03, 0.03),
    new THREE.MeshStandardMaterial({ color: 0x222 })
  );
  sight.position.y = w.bodySize[1]*0.7;
  sight.position.z = -w.bodySize[2]*0.3;
  g.add(sight);

  return g;
}

function equipWeapon(idx) {

  if (currentWeaponMesh) weaponGroup.remove(currentWeaponMesh);
  currentWeaponIdx = idx;
  const w = WEAPONS[idx];
  currentWeaponMesh = buildWeaponMesh(w);

}

const raycaster = new THREE.Raycaster();
let enemies = [];
let score = 0;

function shoot() {
  if (state.reloading) return;
  if (state.hp <= 0) return;

  const w = WEAPONS[currentWeaponIdx];
  const now = performance.now();
  if (now - state.lastShot < w.fireRate) return;
  state.lastShot = now;

  if (state.ammo <= 0) {
    Sound.empty();
    return;
  }

  state.ammo--;
  updateHUD();
  Sound.shot(w.type);
  gunKick = w.recoil * 1.2;
  state.pitch += w.recoil * (0.5 + Math.random() * 0.5);
  state.yaw += (Math.random() - 0.5) * w.recoil * 0.5;

  // Raycast
  const pellets = w.pellets || 1;
  for (let p = 0; p < pellets; p++) {
    const spreadX = (Math.random() - 0.5) * w.spread * (isADS ? 0.3 : 1);
    const spreadY = (Math.random() - 0.5) * w.spread * (isADS ? 0.3 : 1);

    raycaster.setFromCamera(new THREE.Vector2(spreadX, spreadY), camera);
    const allTargets = [];
    for (const e of enemies) for (const c of e.children) allTargets.push(c);

    const hits = raycaster.intersectObjects(allTargets, true);
    if (hits.length > 0) {
      const hit = hits[0];
      let obj = hit.object;
      while (obj.parent && !enemies.includes(obj)) obj = obj.parent;

      if (enemies.includes(obj)) {
        const isHead = hit.object.userData.isHead;
        const dmg = isHead ? w.headshot : w.damage;
        obj.userData.hp -= dmg;

        if (isHead) Sound.headshot(); else Sound.hit();
        showHitMarker(isHead);

        // Кровь
        createBloodParticles(hit.point);

        // Подсветка
        obj.children[0].material.color.setHex(0xff5555);
        setTimeout(() => {
          if (obj.children[0]) obj.children[0].material.color.setHex(0x883333);
        }, 80);

        if (obj.userData.hp <= 0) killEnemy(obj);
      }
    }
  }
}

function createBloodParticles(pos) {
  const geo = new THREE.SphereGeometry(0.06, 4, 4);
  const mat = new THREE.MeshBasicMaterial({ color: 0xaa0000 });
  for (let i = 0; i < 6; i++) {
    const p = new THREE.Mesh(geo, mat);
    p.position.copy(pos);
    const vel = new THREE.Vector3(
      (Math.random()-0.5)*4,
      Math.random()*3,
      (Math.random()-0.5)*4
    );
    world.add(p);
    const start = performance.now();
    const anim = () => {
      const t = (performance.now() - start) / 600;
      if (t >= 1) { world.remove(p); return; }
      p.position.addScaledVector(vel, 0.016);
      vel.y -= 0.5;
      p.scale.setScalar(1 - t);
      requestAnimationFrame(anim);
    };
    anim();
  }
}

function showHitMarker(isHead) {
  const hm = document.getElementById('hit-marker');
  hm.style.opacity = '1';
  hm.style.filter = isHead ? 'hue-rotate(60deg) brightness(1.5)' : '';
  setTimeout(() => hm.style.opacity = '0', 120);
}

function spawnEnemy() {
  const g = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x883333, roughness: 0.8 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 1.0, 6, 12), bodyMat);
  body.position.y = 0.9;
  body.castShadow = true;
  g.add(body);

  const headMat = new THREE.MeshStandardMaterial({ color: 0xddbb99, roughness: 0.7 });
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 12), headMat);
  head.position.y = 1.75;
  head.castShadow = true;
  head.userData.isHead = true;
  g.add(head);

  const gun = new THREE.Mesh(
    new THREE.BoxGeometry(0.12, 0.12, 0.5),
    new THREE.MeshStandardMaterial({ color: 0x222 })
  );
  gun.position.set(0.35, 1.3, -0.35);
  g.add(gun);

  // Спавн далеко от игрока
  let x, z, dist;
  do {
    const angle = Math.random() * Math.PI * 2;
    const r = 25 + Math.random() * 20;
    x = Math.cos(angle) * r;
    z = Math.sin(angle) * r;
    dist = Math.hypot(x - state.pos.x, z - state.pos.z);
  } while (dist < 15);

  g.position.set(x, 0, z);
  g.userData = { hp: 100, lastShot: 0, alive: true };
  scene.add(g);
  enemies.push(g);
}

function killEnemy(e) {
  Sound.death();
  scene.remove(e);
  const i = enemies.indexOf(e);
  if (i >= 0) enemies.splice(i, 1);
  score++;
  updateHUD();
  addKillFeed('☠ Враг уничтожен');

  if (enemies.length === 0) {
    setTimeout(() => {
      for (let i = 0; i < 3; i++) spawnEnemy();
    }, 1500);
  }
}

function updateEnemies(dt, now) {
  for (const e of enemies) {
    const dx = state.pos.x - e.position.x;
    const dz = state.pos.z - e.position.z;
    const dist = Math.hypot(dx, dz);

    e.rotation.y = Math.atan2(dx, dz);

    if (dist > 8 && dist < 35) {
      const nx = e.position.x + (dx / dist) * 2.5 * dt;
      const nz = e.position.z + (dz / dist) * 2.5 * dt;
      if (!checkCollision(nx, 1, e.position.z)) e.position.x = nx;
      if (!checkCollision(e.position.x, 1, nz)) e.position.z = nz;
    }

    if (dist < 30 && now - e.userData.lastShot > 1200 + Math.random() * 800) {
      e.userData.lastShot = now;
      Sound.enemyShot();

      if (Math.random() < 0.3) {
        state.hp -= 8 + Math.floor(Math.random() * 10);
        Sound.hurt();
        flashDamage();
        updateHUD();
        if (state.hp <= 0) gameOver();
      }
    }
  }
}

function reload() {
  const w = WEAPONS[currentWeaponIdx];
  if (state.reloading) return;
  if (state.ammo >= w.magSize) return;
  if (state.reserve <= 0) return;

  state.reloading = true;
  document.getElementById('reloading').style.display = 'block';
  Sound.reload();

  setTimeout(() => {
    const need = w.magSize - state.ammo;
    const take = Math.min(need, state.reserve);
    state.ammo += take;
    state.reserve -= take;
    state.reloading = false;
    document.getElementById('reloading').style.display = 'none';
    updateHUD();
  }, w.reloadTime);
}

}

const PLAYER_RADIUS = 0.4;

function checkCollision(x, y, z) {
  for (const c of collidables) {
    if (x + PLAYER_RADIUS > c.min.x && x - PLAYER_RADIUS < c.max.x &&
        y + 1.6 > c.min.y && y - 0.2 < c.max.y &&
        z + PLAYER_RADIUS > c.min.z && z - PLAYER_RADIUS < c.max.z) return true;
  }
  return false;
}

const WALK = 5.5, RUN = 8.5, JUMP = 6.5, GRAV = -20;

function updatePlayer(dt) {
  const forward = new THREE.Vector3(-Math.sin(state.yaw), 0, -Math.cos(state.yaw));
  const right = new THREE.Vector3(Math.cos(state.yaw), 0, -Math.sin(state.yaw));

  const dir = new THREE.Vector3();
  if (state.keys['KeyW']) dir.add(forward);
  if (state.keys['KeyS']) dir.sub(forward);
  if (state.keys['KeyD']) dir.add(right);
  if (state.keys['KeyA']) dir.sub(right);

  const running = state.keys['ShiftLeft'] || state.keys['ShiftRight'];
  const speed = (running ? RUN : WALK) * (isADS ? 0.5 : 1);

  if (dir.lengthSq() > 0) {
    dir.normalize().multiplyScalar(speed * dt);
    const nx = state.pos.x + dir.x;
    const nz = state.pos.z + dir.z;
    if (!checkCollision(nx, state.pos.y, state.pos.z)) state.pos.x = nx;
    if (!checkCollision(state.pos.x, state.pos.y, nz)) state.pos.z = nz;

    const now = performance.now();
    if (now - state.lastStep > (running ? 300 : 450)) {
      state.lastStep = now;
    }
  }

  state.vel.y += GRAV * dt;
  if (state.keys['Space'] && state.onGround) {
    state.vel.y = JUMP;
    state.onGround = false;
  }
  state.pos.y += state.vel.y * dt;

  if (state.pos.y <= 1.7) {
    state.pos.y = 1.7;
    state.vel.y = 0;
    state.onGround = true;
  }

  state.pos.x = Math.max(-48, Math.min(48, state.pos.x));
  state.pos.z = Math.max(-48, Math.min(48, state.pos.z));

  camera.position.copy(state.pos);
  camera.rotation.y = state.yaw;
  camera.rotation.x = state.pitch;

  // Авто-огонь
  const w = WEAPONS[currentWeaponIdx];
  if (mouseDown && w.auto) shoot();
}

// ============================================================
//  АНИМАЦИЯ ОРУЖИЯ
// ============================================================
function updateWeapon(dt) {
  if (!currentWeaponMesh) return;

  const target = isADS ? WEAPON_POS.ads : WEAPON_POS.base;

  const moving = state.keys['KeyW'] || state.keys['KeyA'] || state.keys['KeyS'] || state.keys['KeyD'];
  const t = performance.now() * 0.006;
  const bobX = moving ? Math.sin(t) * 0.008 : 0;
  const bobY = moving ? Math.abs(Math.cos(t)) * 0.008 : 0;

  gunKick *= 0.82;
  if (gunKick < 0.001) gunKick = 0;

  currentWeaponMesh.position.x += (target.x + bobX - currentWeaponMesh.position.x) * Math.min(1, dt * 12);
  currentWeaponMesh.position.y += (target.y + bobY - currentWeaponMesh.position.y) * Math.min(1, dt * 12);
  currentWeaponMesh.position.z = target.z + gunKick;

  currentWeaponMesh.rotation.x = gunKick * 3;
  currentWeaponMesh.rotation.z = isADS ? 0 : Math.sin(t * 0.7) * 0.01;
}

// ============================================================
//  ЦИКЛ
// ============================================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now();

  if (gameStarted && state.hp > 0) {
    updatePlayer(dt);
    updateEnemies(dt, now);
  }

  updateWeapon(dt);

  renderer.render(scene, camera);
}

// ============================================================
//  СТАРТ
// ============================================================
equipWeapon(0);
for (let i = 0; i < 3; i++) spawnEnemy();
updateHUD();
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
