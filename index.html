<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Counter Kot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: Arial, sans-serif; user-select: none; color: #fff; }
  canvas { display: block; }

  #crosshair {
    position: fixed; top: 50%; left: 50%; width: 22px; height: 22px;
    margin: -11px 0 0 -11px; pointer-events: none; z-index: 10;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #0f0; box-shadow: 0 0 4px #0f0;
  }
  #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #crosshair::after  { top: 10px; left: 0; height: 2px; width: 22px; }

  #hud {
    position: fixed; bottom: 20px; left: 30px; z-index: 10;
    display: flex; gap: 40px; align-items: flex-end;
    pointer-events: none; text-shadow: 2px 2px 4px #000;
  }
  #hud .stats { flex-direction: column; align-items: flex-start; display: flex; }
  #hud .weapon-name { font-size: 14px; color: #ffa; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
  #hud .bottom-row { display: flex; align-items: baseline; gap: 8px; }
  #hud .icon { font-size: 24px; }
  #hud .hp-num { font-size: 42px; font-weight: bold; color: #fff; }
  #hud .hp-num.low { color: #f33; }
  #hud .hp-bar { width: 100px; height: 8px; background: rgba(0,0,0,0.6); border: 1px solid #444; margin-top: 4px; }
  #hud .hp-fill { height: 100%; background: linear-gradient(90deg, #f33, #0f0); width: 100%; transition: width 0.2s; }
  #hud .ammo-num { font-size: 42px; font-weight: bold; color: #fff; }
  #hud .ammo-max { font-size: 22px; color: #888; }

  #damage-flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(circle, transparent 40%, rgba(255,0,0,0.7));
    opacity: 0; transition: opacity 0.15s;
  }
  #hit-marker {
    position: fixed; top: 50%; left: 50%; width: 30px; height: 30px;
    margin: -15px 0 0 -15px; pointer-events: none; opacity: 0; z-index: 6;
  }
  #hit-marker::before, #hit-marker::after {
    content: ''; position: absolute; background: #f00; box-shadow: 0 0 6px #f00;
  }
  #hit-marker::before { left: 14px; top: 0; width: 2px; height: 30px; transform: rotate(45deg); }
  #hit-marker::after  { left: 14px; top: 0; width: 2px; height: 30px; transform: rotate(-45deg); }

  #kill-feed { position: fixed; top: 20px; right: 20px; z-index: 10; font-size: 14px; text-align: right; }
  #kill-feed div { background: rgba(0,0,0,0.7); padding: 6px 12px; margin-bottom: 4px; border-left: 3px solid #ffa; animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateX(20px); } }

  #score { position: fixed; top: 20px; left: 20px; z-index: 10;
    background: rgba(0,0,0,0.7); padding: 10px 18px; border-radius: 4px;
    font-size: 18px; border-left: 3px solid #ffa; }
  #score .num { color: #ffa; font-weight: bold; font-size: 24px; }

  #players-list {
    position: fixed; top: 80px; right: 20px; z-index: 10;
    background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 4px;
    font-size: 13px; min-width: 180px; border-left: 3px solid #0af;
  }
  #players-list .title { color: #0af; font-weight: bold; margin-bottom: 6px; }
  #players-list .p { padding: 3px 0; }
  #players-list .p::before { content: '▪ '; color: #0f0; }
  #players-list .p.me::before { content: '★ '; color: #ffa; }

  #room-info {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 4px;
    font-size: 14px; z-index: 10; display: none;
  }
  #room-info b { color: #ff0; cursor: pointer; letter-spacing: 3px; }

  #reloading { position: fixed; top: 55%; left: 50%; transform: translateX(-50%);
    color: #ffa; font-size: 22px; letter-spacing: 3px;
    display: none; z-index: 10; text-shadow: 2px 2px 4px #000; }

  #menu {
    position: fixed; inset: 0; z-index: 100; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle, #2a2a2a, #000); text-align: center; padding: 20px;
    overflow-y: auto;
  }
  #menu.hidden { display: none; }
  #menu h1 {
    font-size: 60px; letter-spacing: 8px; margin-bottom: 10px;
    color: #fff; text-shadow: 0 0 30px #f80, 4px 4px 0 #000;
    font-family: Impact, sans-serif;
  }
  #menu .sub { color: #ffa; font-size: 18px; margin-bottom: 25px; letter-spacing: 4px; }

  .panel {
    background: rgba(0,0,0,0.6); padding: 25px; border-radius: 8px;
    border: 1px solid rgba(255,136,0,0.4); max-width: 450px; width: 100%;
  }
  .panel h2 { color: #ffa; font-size: 16px; margin-bottom: 12px; letter-spacing: 2px; }
  .panel input {
    width: 100%; padding: 12px 15px; font-size: 15px;
    background: rgba(0,0,0,0.5); border: 1px solid #f80; color: #fff;
    border-radius: 4px; outline: none; font-family: inherit;
    margin-bottom: 10px; text-align: center;
  }
  .panel input.code { text-transform: uppercase; letter-spacing: 6px; font-weight: bold; font-size: 20px; }
  .panel button {
    width: 100%; padding: 12px; font-size: 14px;
    background: linear-gradient(180deg, #f80, #c60); color: #000;
    border: none; border-radius: 4px; cursor: pointer;
    font-family: inherit; font-weight: bold; margin-bottom: 8px;
    letter-spacing: 2px; transition: transform 0.1s;
  }
  .panel button:hover { transform: scale(1.02); }
  .panel button.secondary { background: transparent; color: #f80; border: 1px solid #f80; }
  .panel .or { color: #666; text-align: center; margin: 8px 0; font-size: 12px; }
  .panel .status { color: #ffa; font-size: 13px; margin-top: 8px; text-align: center; min-height: 18px; }
  .panel .status.err { color: #f55; }

  #lobby-list {
    max-height: 200px; overflow-y: auto; margin: 10px 0;
    border-top: 1px solid #444; border-bottom: 1px solid #444;
  }
  .lobby-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px; border-bottom: 1px solid #222; font-size: 13px;
  }
  .lobby-item:last-child { border-bottom: none; }
  .lobby-item .name { color: #ffa; font-weight: bold; }
  .lobby-item .players { color: #0f0; font-size: 11px; }
  .lobby-item button {
    width: auto; padding: 4px 14px; font-size: 12px; margin: 0;
    background: #f80; color: #000;
  }
</style>
</head>

<div id="reloading">ПЕРЕЗАРЯДКА...</div>

</div>

      <span class="icon">🔫</span>

  <h1>COUNTER KOT</h1>

  <div class="panel">

    <h2>СОЗДАТЬ</h2>
    <button id="createBtn">СОЗДАТЬ КОМНАТУ</button>

    <div class="or">— СПИСОК СЕРВЕРОВ —</div>
    <button id="refreshBtn" class="secondary">ОБНОВИТЬ СПИСОК</button>
    <div id="lobby-list">
      <div style="color:#666; font-size:12px; text-align:center; padding:10px;">Нажми "Обновить"</div>

    <div class="or">— ИЛИ ПО КОДУ —</div>
    <input type="text" id="joinInput" class="code" placeholder="КОД" maxlength="6">
    <button id="joinBtn" class="secondary">ПОДКЛЮЧИТЬСЯ</button>

    <div class="status" id="status"></div>

</div>

{

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

console.log('🐱 Counter Kot старт...');

// ============================================================
//  КОНСТАНТЫ
// ============================================================
const MAX_PLAYERS = 10;
const API_URL = 'https://kotosthangout.mikrotechh.workers.dev/api/lobbies';
const ROOM_PREFIX = 'counter-kot-';
const MODEL_URL = './kot.glb';
const PING_INTERVAL = 20000;
const LOBBY_TIMEOUT = 60000;

const ICE_CONFIG = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
  ]
};

const PEER_CONFIG = {
  config: ICE_CONFIG,
  debug: 1
};

// ============================================================
//  ЗВУКИ
// ============================================================
const Sound = {
  ctx: null, master: null,
  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.35;
      this.master.connect(this.ctx.destination);
    } catch(e) {}
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  noise(dur) {
    const sr = this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, Math.max(1, sr*dur), sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
    return buf;
  },
  shot(type = 'rifle') {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const cfg = {
      rifle:  { lp: 900,  dur: 0.15, gain: 0.7, low: 180 },
      pistol: { lp: 1500, dur: 0.10, gain: 0.5, low: 220 },
      shotgun:{ lp: 600,  dur: 0.25, gain: 0.9, low: 100 },
      sniper: { lp: 700,  dur: 0.30, gain: 1.0, low: 80  }
    }[type] || { lp: 1000, dur: 0.12, gain: 0.6, low: 150 };

    const s = this.ctx.createBufferSource(); s.buffer = this.noise(cfg.dur);
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cfg.lp;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(cfg.gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + cfg.dur);
    s.connect(f).connect(g).connect(this.master); s.start(t);

    const o = this.ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(cfg.low, t);
    o.frequency.exponentialRampToValueAtTime(30, t + cfg.dur*0.7);
    const og = this.ctx.createGain();
    og.gain.setValueAtTime(cfg.gain*0.7, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + cfg.dur*0.8);
    o.connect(og).connect(this.master); o.start(t); o.stop(t + cfg.dur);
  },
  reloadClick() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const s = this.ctx.createBufferSource(); s.buffer = this.noise(0.05);
    const f = this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1800;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.05);
    s.connect(f).connect(g).connect(this.master); s.start(t);
  },
  reload() {
    if (!this.ctx) return;
    this.reloadClick();
    setTimeout(() => this.reloadClick(), 300);
    setTimeout(() => this.reloadClick(), 700);
  },
  empty() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const s = this.ctx.createBufferSource(); s.buffer = this.noise(0.04);
    const f = this.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=4000;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.04);
    s.connect(f).connect(g).connect(this.master); s.start(t);
  },
  hit() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type='square';
    o.frequency.setValueAtTime(800, t);
    o.frequency.exponentialRampToValueAtTime(400, t+0.08);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.1);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+0.1);
  },
  headshot() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(1600, t);
    o.frequency.exponentialRampToValueAtTime(2200, t+0.1);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.15);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+0.15);
  },
  enemyShot() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const s = this.ctx.createBufferSource(); s.buffer = this.noise(0.12);
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=700;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.15);
    s.connect(f).connect(g).connect(this.master); s.start(t);
  },
  death() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(400, t);
    o.frequency.exponentialRampToValueAtTime(60, t+0.6);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.7);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+0.7);
  },
  hurt() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(200, t);
    o.frequency.exponentialRampToValueAtTime(80, t+0.2);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.25);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+0.25);
  }
};

// ============================================================
//  THREE.JS
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc8b088);
scene.fog = new THREE.Fog(0xc8b088, 30, 140);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.05, 500);
camera.rotation.order = 'YXZ';
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffe4b5, 0.5));
scene.add(new THREE.HemisphereLight(0xffe4b5, 0x554433, 0.6));

const sun = new THREE.DirectionalLight(0xffeecc, 1.5);
sun.position.set(60, 80, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -80; sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80; sun.shadow.camera.bottom = -80;
sun.shadow.camera.far = 200;
scene.add(sun);

// ============================================================
//  ТЕКСТУРЫ
// ============================================================
function makeTexture(base, opts = {}) {
  const { noise = 25, size = 512, pattern = null, repeat = [1,1], stains = 0, scratches = 0 } = opts;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, size, size);

  const img = ctx.getImageData(0, 0, size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * noise;
    img.data[i]   = Math.max(0, Math.min(255, img.data[i]   + n));
    img.data[i+1] = Math.max(0, Math.min(255, img.data[i+1] + n));
    img.data[i+2] = Math.max(0, Math.min(255, img.data[i+2] + n));
  }
  ctx.putImageData(img, 0, 0);

  if (stains) for (let i = 0; i < stains; i++) {
    const x = Math.random() * size, y = Math.random() * size, r = 10 + Math.random() * 40;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, Math.random() > 0.5 ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.15)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  if (scratches) for (let i = 0; i < scratches; i++) {
    ctx.strokeStyle = `rgba(${Math.random()>0.5?'255,255,255':'0,0,0'},${0.05 + Math.random()*0.15})`;
    ctx.lineWidth = 0.5 + Math.random() * 1.5;
    ctx.beginPath();
    const x = Math.random() * size, y = Math.random() * size;
    const len = 20 + Math.random() * 100, ang = Math.random() * Math.PI * 2;
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    ctx.stroke();
  }

  if (pattern === 'sand') {
    for (let i = 0; i < 1500; i++) {
      ctx.fillStyle = `rgba(${200+Math.random()*40},${170+Math.random()*30},${120+Math.random()*30},${0.2+Math.random()*0.4})`;
      ctx.fillRect(Math.random()*size, Math.random()*size, 1+Math.random()*2, 1+Math.random()*2);
    }
  } else if (pattern === 'brick') {
    const bh = size / 8, bw = size / 4;
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 3;
    for (let y = 0; y < size; y += bh) {
      const off = (y / bh) % 2 ? bw / 2 : 0;
      for (let x = -bw; x < size + bw; x += bw) {
        ctx.strokeRect(x + off + 2, y + 2, bw - 4, bh - 4);
        if (Math.random() > 0.7) {
          ctx.fillStyle = `rgba(0,0,0,${0.1 + Math.random()*0.2})`;
          ctx.fillRect(x + off + 2, y + 2, bw - 4, bh - 4);
        }
      }
    }
  } else if (pattern === 'wood') {
    for (let i = 0; i < 60; i++) {
      ctx.strokeStyle = `rgba(${40+Math.random()*30},${20+Math.random()*20},${10+Math.random()*10},${0.2 + Math.random()*0.4})`;
      ctx.lineWidth = 1 + Math.random() * 3;
      ctx.beginPath();
      const y = Math.random() * size;
      ctx.moveTo(0, y);
      ctx.bezierCurveTo(size/3, y + (Math.random()-0.5)*30, 2*size/3, y + (Math.random()-0.5)*30, size, y + (Math.random()-0.5)*10);
      ctx.stroke();
    }
  } else if (pattern === 'metal') {
    for (let i = 0; i < 80; i++) {
      ctx.strokeStyle = `rgba(255,255,255,${0.03 + Math.random()*0.08})`;
      ctx.lineWidth = 0.5 + Math.random() * 2;
      ctx.beginPath();
      const y = Math.random() * size;
      ctx.moveTo(0, y); ctx.lineTo(size, y + (Math.random()-0.5)*10);
      ctx.stroke();
    }
  } else if (pattern === 'concrete') {
    for (let i = 0; i < 300; i++) {
      ctx.fillStyle = `rgba(${Math.random()>0.5?'255,255,255':'0,0,0'},${0.02 + Math.random()*0.08})`;
      ctx.beginPath();
      ctx.arc(Math.random()*size, Math.random()*size, 1 + Math.random() * 4, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (pattern === 'crate') {
    ctx.strokeStyle = 'rgba(40,20,5,0.7)';
    ctx.lineWidth = 6;
    ctx.strokeRect(4, 4, size-8, size-8);
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(4, 4); ctx.lineTo(size-4, size-4);
    ctx.moveTo(size-4, 4); ctx.lineTo(4, size-4); ctx.stroke();
    ctx.lineWidth = 8;
    for (let i = 1; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(4, i * size / 4); ctx.lineTo(size-4, i * size / 4); ctx.stroke();
    }
    for (const [bx, by] of [[12,12],[size-12,12],[12,size-12],[size-12,size-12]]) {
      const grad = ctx.createRadialGradient(bx-2, by-2, 0, bx, by, 6);
      grad.addColorStop(0, 'rgba(200,200,200,0.9)');
      grad.addColorStop(1, 'rgba(20,10,0,0.8)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(bx, by, 6, 0, Math.PI * 2); ctx.fill();
    }
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeat[0], repeat[1]);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

  const grip = new THREE.Mesh(
    new THREE.BoxGeometry(w.bodySize[0]*0.6, w.bodySize[1]*1.2, w.bodySize[0]*0.5),

function normalizeModel(model) {
  const bbox = new THREE.Box3().setFromObject(model);
  const size = bbox.getSize(new THREE.Vector3());
  if (size.y === 0) return model;
  const scale = 1.8 / size.y;
  model.scale.setScalar(scale);

  const bbox2 = new THREE.Box3().setFromObject(model);
  const center = bbox2.getCenter(new THREE.Vector3());
  model.position.x -= center.x;
  model.position.z -= center.z;
  model.position.y -= bbox2.min.y;

  model.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
    }
  });
  return model;
}

function makeNameSprite(text) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, 256, 64);
  ctx.strokeStyle = '#f80';
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, 256, 64);
  ctx.font = 'bold 30px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffa';
  ctx.fillText(text, 128, 34);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  sprite.scale.set(2.5, 0.6, 1);
  return sprite;
}

function makeCatInstance(name) {
  let instance;
  if (state.catModel) {
    instance = state.catModel.clone(true);
    instance.traverse(o => {
      if (o.isMesh && o.material) {
        o.material = o.material.clone();
      }
    });
  } else {
    instance = fallbackCat();
  }

  // Находим голову для хедшота
  let headFound = false;
  instance.traverse(o => {
    if (!headFound && o.isMesh) {
      const box = new THREE.Box3().setFromObject(o);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      if (center.y > 1.2 && size.y < 0.8) {
        o.userData.isHead = true;
        headFound = true;
      }
    }
  });

  const label = makeNameSprite(name || 'Кот');
  label.position.y = 2.4;
  instance.add(label);

  return instance;
}

async function loadLobbies() {
  lobbyListEl.innerHTML = '<div style="color:#666; text-align:center; padding:8px;">Загрузка...</div>';
  try {
    const res = await fetch(API_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const lobbies = await res.json();

    if (!Array.isArray(lobbies) || lobbies.length === 0) {
      lobbyListEl.innerHTML = '<div style="color:#666; text-align:center; padding:8px;">Нет серверов. Создай свой!</div>';
      return;
    }

    lobbyListEl.innerHTML = '';
    lobbies.forEach(lobby => {
      const div = document.createElement('div');
      div.className = 'lobby-item';
      div.innerHTML = `
        <div>
          <div class="name">${escapeHtml(lobby.name)}</div>
          <div class="players">${lobby.players}/${lobby.max} игроков</div>
        </div>
      `;
      const btn = document.createElement('button');
      btn.textContent = 'ВОЙТИ';
      btn.onclick = () => joinByCode(lobby.code);
      div.appendChild(btn);
      lobbyListEl.appendChild(div);
    });
  } catch(e) {
    console.error('Lobby load error:', e);
    lobbyListEl.innerHTML = '<div style="color:#f55; text-align:center; padding:8px;">Ошибка загрузки</div>';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function genRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

let lobbyPingInterval = null;

function createRoom() {
  state.name = $('nameInput').value.trim().slice(0, 16) || 'Кот';
  state.isHost = true;
  state.roomCode = genRoomCode();
  setStatus('Создаём комнату...');

  const peerId = ROOM_PREFIX + state.roomCode;
  console.log('🎮 Создаю комнату:', peerId);

  const peer = new Peer(peerId, PEER_CONFIG);
  let resolved = false;

  peer.on('open', async (id) => {
    if (resolved) return;
    resolved = true;
    state.peer = peer;
    state.myId = id;
    console.log('✅ Хост открыт:', id);

    // Регистрируем в лобби
    registerLobby();

    // Пингуем каждые 20 сек
    if (lobbyPingInterval) clearInterval(lobbyPingInterval);
    lobbyPingInterval = setInterval(registerLobby, PING_INTERVAL);

    peer.on('connection', handleIncomingConnection);
    peer.on('error', (err) => console.warn('Peer err:', err.type));
    onConnected();
  });

  peer.on('error', (err) => {
    if (resolved) return;
    console.error('❌ Create error:', err.type);
    try { peer.destroy(); } catch(e) {}
    setStatus('Ошибка: ' + err.type, true);
  });
}

async function registerLobby() {
  try {
    await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        code: state.roomCode,
        name: state.name + ' · комната',
        players: state.connections.size + 1,
        max: MAX_PLAYERS,
        hostPeerId: state.myId
      })
    });
  } catch(e) {
    console.warn('Lobby register failed:', e);
  }
}

function handleIncomingConnection(conn) {
  console.log('📥 Входящее от', conn.peer);
  if (state.connections.size >= MAX_PLAYERS - 1) {
    conn.on('open', () => {
      conn.send({ type: 'kick', reason: 'Комната заполнена' });
      setTimeout(() => conn.close(), 500);
    });
    return;
  }
  setupConnection(conn);
}

function joinByCode(code) {
  state.name = $('nameInput').value.trim().slice(0, 16) || 'Кот';
  state.isHost = false;
  state.roomCode = code.toUpperCase();
  setStatus('Подключаемся...');
  console.log('🔗 Подключаюсь к:', ROOM_PREFIX + state.roomCode);

  const peer = new Peer(PEER_CONFIG);
  let resolved = false;

  peer.on('open', (id) => {
    state.peer = peer;
    state.myId = id;
    const conn = peer.connect(ROOM_PREFIX + state.roomCode, { reliable: true });
    setupConnection(conn);

    const timeout = setTimeout(() => {
      if (!conn.open && !resolved) {
        setStatus('Не удалось подключиться', true);
        try { peer.destroy(); } catch(e) {}
      }
    }, 15000);

    conn.on('open', () => {
      resolved = true;
      clearTimeout(timeout);
      onConnected();
    });
  });

  peer.on('error', (err) => {
    if (resolved) return;
    console.error('❌ Join error:', err.type);
    if (err.type === 'peer-unavailable') setStatus('Комната не найдена', true);
    else setStatus('Ошибка: ' + err.type, true);
    try { peer.destroy(); } catch(e) {}
  });
}

function setupConnection(conn) {
  conn.on('open', () => {
    console.log('✅ Conn открыт с', conn.peer);
    state.connections.set(conn.peer, { conn, data: null, mesh: null, hp: 100 });
    conn.send({ type: 'hello', name: state.name });

    if (state.isHost) {
      const list = [{ id: state.myId, name: state.name }];
      for (const [pid, c] of state.connections) {
        if (c.data && pid !== conn.peer) list.push({ id: pid, name: c.data.name });
      }
      conn.send({ type: 'players', list });
      registerLobby();
    }

    updatePlayerList();
  });

  conn.on('data', (data) => handleData(conn.peer, data));

  conn.on('close', () => {
    console.log('❌ Conn закрыт с', conn.peer);
    const c = state.connections.get(conn.peer);
    if (c && c.mesh) scene.remove(c.mesh);
    state.connections.delete(conn.peer);
    if (state.isHost) {
      for (const [, cc] of state.connections) {
        try { cc.conn.send({ type: 'player-left', id: conn.peer }); } catch(e) {}
      }
      registerLobby();
    }
    updatePlayerList();
    addKillFeed('💤 Игрок вышел');
  });

  conn.on('error', (e) => console.warn('Conn error:', e));
}

function handleData(fromId, data) {
  if (!data || typeof data !== 'object') return;
  const c = state.connections.get(fromId);

  switch (data.type) {
    case 'hello':
      if (c) {
        c.data = c.data || {};
        c.data.name = data.name || 'Кот';
      }
      updatePlayerList();
      break;
    case 'players':
      for (const p of data.list) {
        if (p.id === state.myId) continue;
        const ex = state.connections.get(p.id);
        if (ex) {
          ex.data = ex.data || {};
          ex.data.name = p.name;
        }
      }
      updatePlayerList();
      break;
    case 'player-left':
      if (c && c.mesh) scene.remove(c.mesh);
      state.connections.delete(fromId);
      updatePlayerList();
      break;
    case 'pos':
      if (c) {
        c.data = c.data || {};
        c.data.x = data.x; c.data.y = data.y; c.data.z = data.z;
        c.data.ry = data.ry;
        c.data.name = c.data.name || data.name || 'Кот';

        if (!c.mesh && modelReady) {
          c.mesh = makeCatInstance(c.data.name);
          scene.add(c.mesh);
        }
        if (c.mesh) {
          c.mesh.position.set(data.x, data.y - 1.7, data.z);
          c.mesh.rotation.y = data.ry;
        }
      }
      break;
    case 'shot':
      // Другой игрок выстрелил
      Sound.enemyShot();
      if (c) {
        // Проверяем попадание в нас
        // Простой raycast от стрелка к нам
        if (data.targetId === state.myId) {
          state.hp -= data.damage || 25;
          Sound.hurt();
          flashDamage();
          updateHUD();
          if (state.hp <= 0) respawn();
        }
      }
      break;
    case 'damage':
      if (data.targetId === state.myId) {
        state.hp -= data.amount || 25;
        Sound.hurt();
        flashDamage();
        updateHUD();
        if (state.hp <= 0) respawn();
      }
      break;
    case 'death':
      if (data.victimId === state.myId) {
        respawn();
      }
      if (c) {
        if (c.mesh) {
          c.mesh.visible = false;
          setTimeout(() => { if (c.mesh) c.mesh.visible = true; }, 3000);
        }
      }
      if (data.killerName === state.name) {
        state.score++;
        updateHUD();
        addKillFeed('☠ Ты убил ' + (data.victimName || 'кота'));
      } else {
        addKillFeed('☠ ' + (data.killerName || '?') + ' убил ' + (data.victimName || '?'));
      }
      break;
    case 'kick':
      alert('Кикнули: ' + (data.reason || ''));
      location.reload();
      break;
  }
}

function respawn() {
  state.hp = 100;
  state.pos.set(
    (Math.random() - 0.5) * 60,
    1.7,
    (Math.random() - 0.5) * 60
  );
  updateHUD();
  addKillFeed('💀 Ты возродился');
}

function onConnected() {
  console.log('🎉 Подключено');
  menuEl.classList.add('hidden');
  $('room-info').style.display = 'block';
  $('players-list').style.display = 'block';
  $('room-code-text').textContent = state.roomCode;
  updatePlayerList();
  updateHUD();

  setTimeout(() => {
    try { renderer.domElement.requestPointerLock(); } catch(e) {}
  }, 100);
}

$('room-code-text').addEventListener('click', () => {
  navigator.clipboard.writeText(state.roomCode);
  addKillFeed('Код скопирован: ' + state.roomCode);
});

function updatePlayerList() {
  const list = $('players-list-body');
  list.innerHTML = '';
  const me = document.createElement('div');
  me.className = 'p me';
  me.textContent = state.name + ' (ты)';
  list.appendChild(me);
  for (const [pid, c] of state.connections) {
    const d = document.createElement('div');
    d.className = 'p';
    d.textContent = (c.data && c.data.name) || 'Кот...';
    list.appendChild(d);
  }
  $('players-count').textContent = state.connections.size + 1;
}

// ============================================================
//  ВВОД
// ============================================================
const blocker = document.getElementById('blocker');
const blockerEl = $('menu');

blockerEl.addEventListener('click', (e) => {
  if (e.target === menuEl || menuEl.contains(e.target)) return;
  Sound.init();
  Sound.resume();
  if (gameStarted) {
    try { renderer.domElement.requestPointerLock(); } catch(e) {}
  }
});

document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === renderer.domElement;
  if (!pointerLocked && state.hp > 0 && gameStarted) {
    // Показать меню? Нет, оставим игру
  }
});

document.addEventListener('mousemove', (e) => {
  if (!pointerLocked) return;
  const sens = isADS ? 0.0012 : 0.0022;
  state.player.yaw -= e.movementX * sens;
  state.player.pitch -= e.movementY * sens;
  state.player.pitch = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, state.player.pitch));
});

document.addEventListener('keydown', (e) => {
  state.keys[e.code] = true;
  if (e.code === 'KeyR') reload();
  if (e.code === 'Digit1') equipWeapon(0);
  if (e.code === 'Digit2') equipWeapon(1);
  if (e.code === 'Digit3') equipWeapon(2);
  if (e.code === 'Digit4') equipWeapon(3);
  if (e.code === 'Digit5') equipWeapon(4);
});
document.addEventListener('keyup', (e) => { state.keys[e.code] = false; });

document.addEventListener('mousedown', (e) => {
  if (e.button === 0 && pointerLocked) {
    state.mouseDown = true;
    shoot();
  }
  if (e.button === 2) isADS = true;
});
document.addEventListener('mouseup', (e) => {
  if (e.button === 0) state.mouseDown = false;
  if (e.button === 2) isADS = false;
});
document.addEventListener('contextmenu', (e) => e.preventDefault());

// ============================================================
//  СТРЕЛЬБА
// ============================================================
const raycaster = new THREE.Raycaster();

function shoot() {
  if (!gameStarted || state.reloading || state.hp <= 0) return;
  const w = WEAPONS[currentWeaponIdx];
  const now = performance.now();
  if (now - state.lastShot < w.fireRate) return;
  state.lastShot = now;

  if (state.ammo <= 0) { Sound.empty(); return; }

  state.ammo--;
  updateHUD();
  Sound.shot(w.type);
  gunKick = w.recoil * 1.2;
  state.player.pitch += w.recoil * (0.5 + Math.random() * 0.5);
  state.player.yaw += (Math.random() - 0.5) * w.recoil * 0.5;

  // Проверяем попадание по другим игрокам
  const allTargets = [];
  for (const [pid, c] of state.connections) {
    if (c.mesh) {
      c.mesh.traverse(o => {
        if (o.isMesh) {
          o.userData.ownerPeer = pid;
          allTargets.push(o);
        }
      });
    }
  }

  const pellets = w.pellets || 1;
  for (let p = 0; p < pellets; p++) {
    const spreadX = (Math.random() - 0.5) * w.spread * (isADS ? 0.3 : 1);
    const spreadY = (Math.random() - 0.5) * w.spread * (isADS ? 0.3 : 1);

    raycaster.setFromCamera(new THREE.Vector2(spreadX, spreadY), camera);
    const hits = raycaster.intersectObjects(allTargets, false);

    if (hits.length > 0) {
      const hit = hits[0];
      const ownerId = hit.object.userData.ownerPeer;
      const isHead = hit.object.userData.isHead;
      const dmg = isHead ? w.headshot : w.damage;

      if (isHead) Sound.headshot(); else Sound.hit();
      showHitMarker(isHead);
      createBloodParticles(hit.point);

      // Отправляем урон владельцу
      const c = state.connections.get(ownerId);
      if (c) {
        c.conn.send({
          type: 'damage',
          targetId: ownerId,
          amount: dmg,
          fromId: state.myId,
          fromName: state.name,
          isHead
        });
      }
    }
  }
}

function createBloodParticles(pos) {
  const geo = new THREE.SphereGeometry(0.06, 4, 4);
  const mat = new THREE.MeshBasicMaterial({ color: 0xaa0000 });
  for (let i = 0; i < 6; i++) {
    const p = new THREE.Mesh(geo, mat);
    p.position.copy(pos);
    const vel = new THREE.Vector3((Math.random()-0.5)*4, Math.random()*3, (Math.random()-0.5)*4);
    world.add(p);
    const start = performance.now();
    const anim = () => {
      const t = (performance.now() - start) / 600;
      if (t >= 1) { world.remove(p); return; }
      p.position.addScaledVector(vel, 0.016);
      vel.y -= 0.5;
      p.scale.setScalar(1 - t);
      requestAnimationFrame(anim);
    };
    anim();
  }
}

function showHitMarker(isHead) {
  const hm = document.getElementById('hit-marker');
  hm.style.opacity = '1';
  hm.style.filter = isHead ? 'hue-rotate(60deg) brightness(1.5)' : '';
  setTimeout(() => hm.style.opacity = '0', 120);
}

// ============================================================
//  HUD
// ============================================================
function updateHUD() {
  document.getElementById('hp-num').textContent = Math.max(0, state.hp);
  document.getElementById('hp-fill').style.width = Math.max(0, state.hp) + '%';
  document.getElementById('hp-num').classList.toggle('low', state.hp < 30);
  document.getElementById('ammo-cur').textContent = state.ammo;
  document.getElementById('ammo-res').textContent = state.reserve;
  document.getElementById('score-num').textContent = state.score;
}

function flashDamage() {
  const f = document.getElementById('damage-flash');
  f.style.opacity = '1';
  setTimeout(() => f.style.opacity = '0', 100);
}

function addKillFeed(text) {
  const kf = document.getElementById('kill-feed');
  const d = document.createElement('div');
  d.textContent = text;
  kf.appendChild(d);
  setTimeout(() => d.remove(), 3000);
}

function reload() {
  const w = WEAPONS[currentWeaponIdx];
  if (state.reloading) return;
  if (state.ammo >= w.magSize) return;
  if (state.reserve <= 0) return;

  state.reloading = true;
  document.getElementById('reloading').style.display = 'block';
  Sound.reload();

  setTimeout(() => {
    const need = w.magSize - state.ammo;
    const take = Math.min(need, state.reserve);
    state.ammo += take;
    state.reserve -= take;
    state.reloading = false;
    document.getElementById('reloading').style.display = 'none';
    updateHUD();
  }, w.reloadTime);
}

// ============================================================
//  КОЛЛИЗИИ И ДВИЖЕНИЕ
// ============================================================
const PLAYER_RADIUS = 0.4;
const WALK = 5.5, RUN = 8.5, JUMP = 6.5, GRAV = -20;

function checkCollision(x, y, z) {
  for (const c of collidables) {
    if (x + PLAYER_RADIUS > c.min.x && x - PLAYER_RADIUS < c.max.x &&
        y + 1.6 > c.min.y && y - 0.2 < c.max.y &&
        z + PLAYER_RADIUS > c.min.z && z - PLAYER_RADIUS < c.max.z) return true;
  }
  return false;
}

function updatePlayer(dt) {
  const p = state.player;
  const forward = new THREE.Vector3(-Math.sin(p.yaw), 0, -Math.cos(p.yaw));
  const right = new THREE.Vector3(Math.cos(p.yaw), 0, -Math.sin(p.yaw));

  const dir = new THREE.Vector3();
  if (state.keys['KeyW']) dir.add(forward);
  if (state.keys['KeyS']) dir.sub(forward);
  if (state.keys['KeyD']) dir.add(right);
  if (state.keys['KeyA']) dir.sub(right);

  const running = state.keys['ShiftLeft'] || state.keys['ShiftRight'];
  const speed = (running ? RUN : WALK) * (isADS ? 0.5 : 1);

  if (dir.lengthSq() > 0) {
    dir.normalize().multiplyScalar(speed * dt);
    const nx = p.pos.x + dir.x;
    const nz = p.pos.z + dir.z;
    if (!checkCollision(nx, p.pos.y, p.pos.z)) p.pos.x = nx;
    if (!checkCollision(p.pos.x, p.pos.y, nz)) p.pos.z = nz;
  }

  p.vel.y += GRAV * dt;
  if (state.keys['Space'] && p.onGround) {
    p.vel.y = JUMP;
    p.onGround = false;
  }
  p.pos.y += p.vel.y * dt;

  if (p.pos.y <= 1.7) {
    p.pos.y = 1.7;
    p.vel.y = 0;
    p.onGround = true;
  }

  p.pos.x = Math.max(-48, Math.min(48, p.pos.x));
  p.pos.z = Math.max(-48, Math.min(48, p.pos.z));

  camera.position.copy(p.pos);
  camera.rotation.y = p.yaw;
  camera.rotation.x = p.pitch;

  const w = WEAPONS[currentWeaponIdx];
  if (state.mouseDown && w.auto) shoot();

  const now = performance.now();
  if (now - p.lastSent > 50) {
    p.lastSent = now;
    sendPosition();
  }
}

function sendPosition() {
  if (!state.peer) return;
  const p = state.player;
  const payload = {
    type: 'pos',
    x: p.pos.x, y: p.pos.y, z: p.pos.z,
    ry: p.yaw,
    name: state.name
  };
  for (const [, c] of state.connections) {
    try { c.conn.send(payload); } catch(e) {}
  }
}

// ============================================================
//  АНИМАЦИЯ ОРУЖИЯ
// ============================================================
function updateWeapon(dt) {
  if (!currentWeaponMesh) return;
  const target = isADS ? WEAPON_POS.ads : WEAPON_POS.base;
  const moving = state.keys['KeyW'] || state.keys['KeyA'] || state.keys['KeyS'] || state.keys['KeyD'];
  const t = performance.now() * 0.006;
  const bobX = moving ? Math.sin(t) * 0.008 : 0;
  const bobY = moving ? Math.abs(Math.cos(t)) * 0.008 : 0;

  gunKick *= 0.82;
  if (gunKick < 0.001) gunKick = 0;

  currentWeaponMesh.position.x += (target.x + bobX - currentWeaponMesh.position.x) * Math.min(1, dt * 12);
  currentWeaponMesh.position.y += (target.y + bobY - currentWeaponMesh.position.y) * Math.min(1, dt * 12);
  currentWeaponMesh.position.z = target.z + gunKick;

  currentWeaponMesh.rotation.x = gunKick * 3;
  currentWeaponMesh.rotation.z = isADS ? 0 : Math.sin(t * 0.7) * 0.01;
}

// ============================================================
//  ЦИКЛ
// ============================================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (gameStarted && state.hp > 0) {
    updatePlayer(dt);
  }

  // Интерполяция удалённых игроков
  for (const [, c] of state.connections) {
    if (c.mesh && c.data) {
      const target = new THREE.Vector3(c.data.x, c.data.y - 1.7, c.data.z);
      c.mesh.position.lerp(target, Math.min(1, dt * 15));
      let dy = c.data.ry - c.mesh.rotation.y;
      while (dy > Math.PI) dy -= Math.PI * 2;
      while (dy < -Math.PI) dy += Math.PI * 2;
      c.mesh.rotation.y += dy * Math.min(1, dt * 15);
    }
  }

  updateWeapon(dt);
  renderer.render(scene, camera);
}

// ============================================================
//  СТАРТ
// ============================================================
function startGame() {
  gameStarted = true;
  renderer.domElement.requestPointerLock();
}

$('createBtn').onclick = () => {
  Sound.init(); Sound.resume();
  state.name = $('nameInput').value.trim() || 'Кот';
  gameStarted = true;
  createRoom();
};

$('joinBtn').onclick = () => {
  const code = $('joinInput').value.trim().toUpperCase();
  if (code.length !== 6) { setStatus('Код 6 символов', true); return; }
  Sound.init(); Sound.resume();
  state.name = $('nameInput').value.trim() || 'Кот';
  gameStarted = true;
  joinByCode(code);
};

$('refreshBtn').onclick = loadLobbies;
$('joinInput').addEventListener('input', (e) => {
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
});

$('nameInput').value = 'Кот' + (100 + Math.floor(Math.random()*900));

Sound.init();
initCatModel().then(() => {
  console.log('🐱 Готово!');
  equipWeapon(0);
  updateHUD();
  animate();
  loadLobbies();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
