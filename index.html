<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Котость Hangout</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; color: #fff; }
  canvas { display: block; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  #crosshair {
    position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
    margin: -3px 0 0 -3px; background: #fff; border-radius: 50%;
    box-shadow: 0 0 6px #fff; opacity: 0.5;
  }

  #roominfo {
    position: absolute; top: 15px; left: 15px;
    background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px;
    border: 1px solid #f0a; font-size: 14px; pointer-events: auto;
  }
  #roominfo .title { color: #f0a; font-weight: bold; margin-bottom: 4px; }
  #roominfo b { color: #f0a; }
  #roominfo .code { font-size: 18px; letter-spacing: 3px; color: #ff0; cursor: pointer; }

  #players {
    position: absolute; top: 120px; left: 15px;
    background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px;
    border: 1px solid #f0a; font-size: 13px; min-width: 180px;
  }
  #players .title { color: #f0a; margin-bottom: 6px; font-weight: bold; }
  #players .p { padding: 3px 0; display: flex; align-items: center; gap: 6px; }
  #players .p::before { content: '🐱'; font-size: 12px; }
  #players .p.me::before { content: '⭐'; }

  #chatlog {
    position: absolute; bottom: 60px; left: 15px; width: 380px; max-height: 260px;
    overflow-y: auto; pointer-events: none; font-size: 14px;
  }
  #chatlog div {
    background: rgba(0,0,0,0.6); padding: 5px 10px; margin-bottom: 3px;
    border-radius: 4px; border-left: 3px solid #f0a;
    word-wrap: break-word; animation: fadeIn 0.2s;
  }
  #chatlog .name { color: #ff0; font-weight: bold; margin-right: 6px; }
  #chatlog .sys { color: #f0a; font-style: italic; border-left-color: #f0a; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } }

  #chatinput {
    position: absolute; bottom: 60px; left: 15px; width: 380px;
    background: rgba(0,0,0,0.85); border: 2px solid #f0a; color: #fff;
    padding: 10px 15px; font-size: 14px; border-radius: 6px;
    font-family: inherit; outline: none; display: none; pointer-events: auto;
  }
  #chatinput.active { display: block; }

  #emotePanel {
    position: absolute; bottom: 15px; right: 15px;
    background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px;
    border: 1px solid #f0a; display: flex; gap: 6px; flex-wrap: wrap;
    max-width: 260px; pointer-events: auto;
  }
  #emotePanel button {
    background: #f0a; border: none; padding: 6px 10px; border-radius: 4px;
    color: #000; font-weight: bold; cursor: pointer; font-family: inherit; font-size: 12px;
  }
  #emotePanel button:hover { background: #ff44cc; }

  #music {
    position: absolute; top: 15px; right: 15px;
    background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px;
    border: 1px solid #f0a; font-size: 12px; pointer-events: auto; max-width: 220px;
  }
  #music .title { color: #f0a; margin-bottom: 6px; font-weight: bold; }
  #music .now { color: #0f0; font-size: 11px; margin-bottom: 6px; word-break: break-all; }
  #music button {
    background: #f0a; color: #000; border: none; padding: 5px 10px;
    border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px;
    margin-right: 4px; font-weight: bold;
  }

  #hint {
    position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px;
    font-size: 12px; color: #ccc; white-space: nowrap;
  }
  #hint b { color: #f0a; }

  /* ===== Главное меню ===== */
  #menu {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(circle at 50% 30%, #4a1a5a, #100010);
    overflow-y: auto; padding: 30px 20px;
    display: flex; flex-direction: column; align-items: center;
  }
  #menu.hidden { display: none; }
  #menu h1 {
    font-size: 64px; margin-bottom: 5px; letter-spacing: 4px;
    background: linear-gradient(90deg, #f0a, #ff0);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 60px rgba(255,0,170,0.5);
  }
  #menu .sub { color: #c8a; margin-bottom: 30px; font-size: 16px; }

  .panel {
    background: rgba(255,255,255,0.05); padding: 25px; border-radius: 12px;
    border: 1px solid rgba(255,0,170,0.3); width: 100%; max-width: 480px;
    margin-bottom: 20px;
  }
  .panel h2 { color: #f0a; font-size: 18px; margin-bottom: 15px; }

  .panel input {
    width: 100%; padding: 12px 15px; font-size: 15px;
    background: rgba(0,0,0,0.4); border: 1px solid #f0a; color: #fff;
    border-radius: 6px; outline: none; font-family: inherit;
    margin-bottom: 12px;
  }
  .panel input.code {
    text-transform: uppercase; text-align: center; letter-spacing: 6px;
    font-weight: bold; font-size: 20px;
  }
  .panel button {
    width: 100%; padding: 12px; font-size: 15px;
    background: linear-gradient(90deg, #f0a, #ff0); color: #000;
    border: none; border-radius: 6px; cursor: pointer;
    font-family: inherit; font-weight: bold; margin-bottom: 10px;
    transition: transform 0.1s;
  }
  .panel button:hover { transform: scale(1.02); }
  .panel button:disabled { opacity: 0.5; cursor: wait; }
  .panel button.secondary {
    background: transparent; color: #f0a; border: 1px solid #f0a;
  }
  .panel button.secondary:hover { background: rgba(255,0,170,0.1); }

  .or { color: #666; text-align: center; margin: 10px 0; font-size: 12px; }

  /* Список серверов */
  #serverList {
    max-height: 340px; overflow-y: auto;
    border-radius: 6px;
  }
  .server-row {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    gap: 10px; align-items: center;
    padding: 10px 12px; margin-bottom: 6px;
    background: rgba(0,0,0,0.4); border-radius: 6px;
    border-left: 3px solid #f0a;
    font-size: 13px;
  }
  .server-row:hover { background: rgba(255,0,170,0.1); }
  .server-row .name { font-weight: bold; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .server-row .players { color: #0f0; font-size: 12px; }
  .server-row .ping { font-size: 12px; min-width: 50px; text-align: right; }
  .server-row .ping.good { color: #0f0; }
  .server-row .ping.mid { color: #ff0; }
  .server-row .ping.bad { color: #f55; }
  .server-row .join {
    background: #f0a; border: none; padding: 5px 12px; border-radius: 4px;
    color: #000; font-weight: bold; cursor: pointer; font-family: inherit;
    font-size: 12px;
  }
  .server-row .join:hover { background: #ff44cc; }
  .empty-list {
    text-align: center; color: #888; padding: 30px 10px; font-style: italic;
  }

  .status { color: #f0a; font-size: 13px; margin-top: 10px; min-height: 18px; text-align: center; }
  .status.err { color: #f55; }

  #createForm { display: none; }
  #createForm.active { display: block; }
</style>
</head>
<body>

<div id="hud">
  <div id="crosshair"></div>
  <div id="roominfo" style="display:none;">
    <div class="title">🐱 <span id="roomName">—</span></div>
    <div>Код: <span class="code" id="roomCode">----</span></div>
    <div style="font-size:11px;color:#888;margin-top:4px;">(клик по коду — скопировать)</div>
  </div>
  <div id="players" style="display:none;">
    <div class="title">Игроки <span id="playerCount">1</span>/10</div>
    <div id="playerList"></div>
  </div>
  <div id="chatlog"></div>
  <input id="chatinput" type="text" maxlength="200" placeholder="Сообщение... Enter — отправить, Esc — отмена">
  <div id="music" style="display:none;">
    <div class="title">🎵 Музыка</div>
    <div class="now" id="musicNow">— ничего —</div>
    <button id="musicPick">Загрузить MP3</button>
    <button id="musicStop">Стоп</button>
    <input type="file" id="musicFile" accept="audio/*" style="display:none;">
  </div>
  <div id="emotePanel" style="display:none;">
    <button data-emote="sit">🐱 Сидеть (E)</button>
    <button data-emote="lay">😴 Лежать (Q)</button>
    <button data-emote="wave">👋 Махать (F)</button>
    <button data-emote="meow">🔊 Мяу (1)</button>
    <button data-emote="meow2">🔊 Мяу2 (2)</button>
    <button data-emote="meow3">🔊 Мурр (3)</button>
  </div>
  <div id="hint" style="display:none;">
    <b>WASD</b> ходьба · <b>Shift</b> бег · <b>Space</b> прыжок · <b>/</b> чат · <b>U</b> музыка · <b>E/Q/F</b> эмоции · <b>1-3</b> мяу
  </div>
</div>

<div id="menu">
  <h1>🐱 Котость Hangout</h1>
  <div class="sub">сетевая тусовка котов · до 10 в комнате</div>

  <!-- Список серверов -->
  <div class="panel">
    <h2>🌐 Доступные серверы</h2>
    <button id="refreshBtn" class="secondary">🔄 Обновить список</button>
    <div id="serverList">
      <div class="empty-list">Загрузка...</div>
    </div>
  </div>

  <!-- Создание / подключение -->
  <div class="panel">
    <h2>🎮 Играть</h2>
    <input type="text" id="nameInput" placeholder="Твоё имя" maxlength="16">
    <button id="createBtn">✨ Создать свой сервер</button>
    <div id="createForm">
      <input type="text" id="serverNameInput" placeholder="Название сервера" maxlength="30">
      <button id="createConfirm">🚀 Запустить</button>
      <button id="createCancel" class="secondary">Отмена</button>
    </div>
    <div class="or">— или по коду —</div>
    <input type="text" id="joinInput" class="code" placeholder="КОД" maxlength="6">
    <button id="joinBtn">🔗 Подключиться</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ============================================================
//  КОНСТАНТЫ
// ============================================================
const MAX_PLAYERS = 10;
const MOVE_SPEED = 5;
const RUN_SPEED = 9;
const JUMP_VEL = 7;
const GRAVITY = -20;
const TICK_RATE = 20;
const CHAT_HISTORY = 60;
const LOBBY_ID = 'kotost-hangout-lobby-v1';
const ROOM_PREFIX = 'kotost-hangout-room-';
const MODEL_URL = './kot.glb';

// ============================================================
//  СОСТОЯНИЕ
// ============================================================
const state = {
  name: '',
  roomCode: '',
  roomName: '',
  isHost: false,
  peer: null,
  connections: new Map(),
  myId: null,
  catModel: null,          // шаблон glb-модели
  player: {
    pos: new THREE.Vector3(0, 1, 0),
    vel: new THREE.Vector3(),
    yaw: 0,
    pitch: 0,
    onGround: true,
    lastSent: 0,
    emote: null,
    emoteUntil: 0
  },
  keys: {},
  chatActive: false,
  lastStep: 0,
  lobbyConn: null,
  lobbyPeer: null
};

// ============================================================
//  ЗВУКИ (Web Audio)
// ============================================================
const Sound = {
  ctx: null,
  init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  meow(pitch = 1) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(600 * pitch, t);
    o.frequency.exponentialRampToValueAtTime(900 * pitch, t + 0.1);
    o.frequency.exponentialRampToValueAtTime(500 * pitch, t + 0.3);
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 1200 * pitch; f.Q.value = 3;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.2, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    o.connect(f).connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t + 0.4);
  },
  purr() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = 'triangle';
    o.frequency.value = 25;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.15, t + 0.2);
    g.gain.setValueAtTime(0.15, t + 0.8);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
    o.connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t + 1.3);
  }
};

// ============================================================
//  THREE.JS
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b8e8);
scene.fog = new THREE.Fog(0x87b8e8, 60, 180);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xaabbdd, 0.55));
scene.add(new THREE.HemisphereLight(0x87b8e8, 0x4a5a3a, 0.7));

const sun = new THREE.DirectionalLight(0xfff2cc, 1.3);
sun.position.set(40, 60, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
sun.shadow.camera.far = 150;
scene.add(sun);

// ============================================================
//  ТЕКСТУРЫ
// ============================================================
function makeTex(base, { noise=25, size=256, pattern=null, repeat=[1,1] } = {}) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = base; ctx.fillRect(0,0,size,size);
  const img = ctx.getImageData(0,0,size,size);
  for (let i=0; i<img.data.length; i+=4) {
    const n = (Math.random()-0.5)*noise;
    img.data[i] = Math.max(0,Math.min(255,img.data[i]+n));
    img.data[i+1] = Math.max(0,Math.min(255,img.data[i+1]+n));
    img.data[i+2] = Math.max(0,Math.min(255,img.data[i+2]+n));
  }
  ctx.putImageData(img,0,0);
  if (pattern === 'grass') {
    for (let i = 0; i < 400; i++) {
      ctx.strokeStyle = `rgba(${40+Math.random()*40},${100+Math.random()*80},${30+Math.random()*30},0.4)`;
      ctx.lineWidth = 1;
      const x = Math.random()*size, y = Math.random()*size;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (Math.random()-0.5)*4, y - 3 - Math.random()*4); ctx.stroke();
    }
  } else if (pattern === 'wood') {
    for (let i = 0; i < 20; i++) {
      ctx.strokeStyle = `rgba(60,30,10,${0.15+Math.random()*0.25})`;
      ctx.lineWidth = 1 + Math.random()*2;
      ctx.beginPath();
      const y = Math.random()*size;
      ctx.moveTo(0, y);
      ctx.bezierCurveTo(size/3, y+(Math.random()-0.5)*20, 2*size/3, y+(Math.random()-0.5)*20, size, y);
      ctx.stroke();
    }
  } else if (pattern === 'brick') {
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 2;
    const bw = size/4, bh = size/8;
    for (let y = 0; y < size; y += bh) {
      const off = (y/bh)%2 ? bw/2 : 0;
      for (let x = -bw; x < size+bw; x += bw) ctx.strokeRect(x+off, y, bw, bh);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeat[0], repeat[1]);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const grassTex = makeTex('#4a7a3a', { pattern: 'grass', noise: 30, repeat: [25, 25] });
const woodTex  = makeTex('#8a5a30', { pattern: 'wood', noise: 25, repeat: [2, 2] });
const brickTex = makeTex('#a05040', { pattern: 'brick', noise: 20, repeat: [2, 2] });
const roofTex  = makeTex('#6a3a1a', { pattern: 'wood', noise: 30, repeat: [3, 3] });
const stoneTex = makeTex('#888888', { noise: 25, repeat: [2, 2] });

const grassMat = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.95 });
const woodMat  = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.8 });
const brickMat = new THREE.MeshStandardMaterial({ map: brickTex, roughness: 0.9 });
const roofMat  = new THREE.MeshStandardMaterial({ map: roofTex, roughness: 0.9 });
const stoneMat = new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.9 });

// ============================================================
//  МИР
// ============================================================
const world = new THREE.Group();
scene.add(world);

const collidables = [];

function addBox(x, y, z, w, h, d, mat, opts = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  world.add(m);
  if (opts.collide !== false) {
    collidables.push({
      min: new THREE.Vector3(x-w/2, y-h/2, z-d/2),
      max: new THREE.Vector3(x+w/2, y+h/2, z+d/2)
    });
  }
  return m;
}

// Земля
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), grassMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
world.add(ground);

// Забор по периметру (декоративный, но с коллизией)
for (let i = -50; i <= 50; i += 5) {
  addBox(i, 0.6, -50, 0.3, 1.2, 0.3, woodMat);
  addBox(i, 0.6,  50, 0.3, 1.2, 0.3, woodMat);
  addBox(-50, 0.6, i, 0.3, 1.2, 0.3, woodMat);
  addBox( 50, 0.6, i, 0.3, 1.2, 0.3, woodMat);
}

// Домики
function buildHouse(cx, cz, w = 6, d = 6, h = 4) {
  addBox(cx, h/2, cz - d/2, w, h, 0.4, brickMat);
  addBox(cx, h/2, cz + d/2, w, h, 0.4, brickMat);
  addBox(cx - w/2, h/2, cz, 0.4, h, d, brickMat);
  addBox(cx + w/2, h/2, cz, 0.4, h, d, brickMat);
  addBox(cx, h + 0.8, cz, w+1, 1.6, d+1, roofMat);
  // Внутренний пол
  const floor = new THREE.Mesh(new THREE.BoxGeometry(w-0.8, 0.1, d-0.8), woodMat);
  floor.position.set(cx, 0.05, cz);
  floor.receiveShadow = true;
  world.add(floor);
}
buildHouse(-25, -20);
buildHouse( 25, -20);
buildHouse( 25,  20);
buildHouse(-25,  20);

// Деревья
function buildTree(x, z) {
  const trunk = addBox(x, 1, z, 0.5, 2, 0.5, woodMat);
  const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2a5a2a, roughness: 1 });
  for (let i = 0; i < 3; i++) {
    const s = 2 - i * 0.4;
    const leaves = new THREE.Mesh(new THREE.SphereGeometry(s, 8, 6), leavesMat);
    leaves.position.set(x, 2.5 + i * 1.3, z);
    leaves.castShadow = true;
    world.add(leaves);
  }
}
for (let i = 0; i < 20; i++) {
  const a = (i / 20) * Math.PI * 2;
  const r = 38 + Math.random() * 6;
  buildTree(Math.cos(a)*r, Math.sin(a)*r);
}
buildTree(-10, -35); buildTree(10, -35);
buildTree(-10, 35);  buildTree(10, 35);

// Костёр в центре
const fireGroup = new THREE.Group();
fireGroup.position.set(0, 0, 0);
world.add(fireGroup);

// камни вокруг
for (let i = 0; i < 8; i++) {
  const a = (i/8) * Math.PI * 2;
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.4 + Math.random()*0.2),
    stoneMat
  );
  rock.position.set(Math.cos(a)*1.2, 0.2, Math.sin(a)*1.2);
  rock.castShadow = true;
  fireGroup.add(rock);
}
// Поленья
for (let i = 0; i < 4; i++) {
  const a = (i/4) * Math.PI * 2;
  const log = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.2, 8), woodMat);
  log.rotation.z = Math.PI/2;
  log.rotation.y = a;
  log.position.set(0, 0.2, 0);
  fireGroup.add(log);
}
// Огонь
const fireLight = new THREE.PointLight(0xff6622, 2, 15);
fireLight.position.y = 1.5;

function buildBench(x, z, rot = 0) {
  const g = new THREE.Group();
  const seat = new THREE.Mesh(new THREE.BoxGeometry(3, 0.2, 0.6), woodMat);
  seat.position.y = 0.6; seat.castShadow = true;
  g.add(seat);
  const back = new THREE.Mesh(new THREE.BoxGeometry(3, 0.8, 0.15), woodMat);
  back.position.set(0, 1.0, -0.25); back.castShadow = true;
  g.add(back);
  for (const dx of [-1.3, 1.3]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.6, 0.6), woodMat);
    leg.position.set(dx, 0.3, 0);
    g.add(leg);
  }
  g.position.set(x, 0, z);
  g.rotation.y = rot;
  world.add(g);
}
