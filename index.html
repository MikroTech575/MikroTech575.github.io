<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Котость Hangout</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; color: #fff; }
  canvas { display: block; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
    margin: -3px 0 0 -3px; background: #fff; border-radius: 50%;
    box-shadow: 0 0 6px #fff; opacity: 0.5; }

  #roominfo { position: absolute; top: 15px; left: 15px;
    background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px;
    border: 1px solid #f0a; font-size: 14px; pointer-events: auto; }
  #roominfo .title { color: #f0a; font-weight: bold; margin-bottom: 4px; }
  #roominfo .code { font-size: 20px; letter-spacing: 4px; color: #ff0; cursor: pointer; font-weight: bold; }

  #players { position: absolute; top: 120px; left: 15px;
    background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px;
    border: 1px solid #f0a; font-size: 13px; min-width: 180px; }
  #players .title { color: #f0a; margin-bottom: 6px; font-weight: bold; }
  #players .p { padding: 3px 0; }
  #players .p::before { content: '🐱 '; font-size: 12px; }
  #players .p.me::before { content: '⭐ '; }

  #chatlog { position: absolute; bottom: 60px; left: 15px; width: 380px; max-height: 260px;
    overflow-y: auto; pointer-events: none; font-size: 14px; }
  #chatlog div { background: rgba(0,0,0,0.6); padding: 5px 10px; margin-bottom: 3px;
    border-radius: 4px; border-left: 3px solid #f0a; word-wrap: break-word; }
  #chatlog .name { color: #ff0; font-weight: bold; margin-right: 6px; }
  #chatlog .sys { color: #f0a; font-style: italic; }

  #chatinput { position: absolute; bottom: 60px; left: 15px; width: 380px;
    background: rgba(0,0,0,0.85); border: 2px solid #f0a; color: #fff;
    padding: 10px 15px; font-size: 14px; border-radius: 6px;
    font-family: inherit; outline: none; display: none; pointer-events: auto; }
  #chatinput.active { display: block; }

  #emotePanel { position: absolute; bottom: 15px; right: 15px;
    background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px;
    border: 1px solid #f0a; display: flex; gap: 6px; flex-wrap: wrap;
    max-width: 280px; pointer-events: auto; }
  #emotePanel button { background: #f0a; border: none; padding: 6px 10px;
    border-radius: 4px; color: #000; font-weight: bold; cursor: pointer;
    font-family: inherit; font-size: 12px; }
  #emotePanel button:hover { background: #ff44cc; }

  #music { position: absolute; top: 15px; right: 15px;
    background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px;
    border: 1px solid #f0a; font-size: 12px; pointer-events: auto; max-width: 220px; }
  #music .title { color: #f0a; margin-bottom: 6px; font-weight: bold; }
  #music .now { color: #0f0; font-size: 11px; margin-bottom: 6px; word-break: break-all; }
  #music button { background: #f0a; color: #000; border: none; padding: 5px 10px;
    border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px;
    margin-right: 4px; font-weight: bold; }

  #hint { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px;
    font-size: 12px; color: #ccc; white-space: nowrap; }
  #hint b { color: #f0a; }

  #menu { position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(circle at 50% 30%, #4a1a5a, #100010);
    overflow-y: auto; padding: 30px 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #menu.hidden { display: none; }
  #menu h1 { font-size: 56px; margin-bottom: 5px; letter-spacing: 4px;
    background: linear-gradient(90deg, #f0a, #ff0);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; }
  #menu .sub { color: #c8a; margin-bottom: 30px; font-size: 16px; text-align: center; }

  .panel { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 12px;
    border: 1px solid rgba(255,0,170,0.3); width: 100%; max-width: 420px; }
  .panel h2 { color: #f0a; font-size: 18px; margin-bottom: 15px; }

  .panel input { width: 100%; padding: 12px 15px; font-size: 15px;
    background: rgba(0,0,0,0.4); border: 1px solid #f0a; color: #fff;
    border-radius: 6px; outline: none; font-family: inherit; margin-bottom: 12px; }
  .panel input.code { text-transform: uppercase; text-align: center;
    letter-spacing: 6px; font-weight: bold; font-size: 22px; }
  .panel button { width: 100%; padding: 12px; font-size: 15px;
    background: linear-gradient(90deg, #f0a, #ff0); color: #000;
    border: none; border-radius: 6px; cursor: pointer;
    font-family: inherit; font-weight: bold; margin-bottom: 10px; }
  .panel button:hover { opacity: 0.9; }
  .panel button:disabled { opacity: 0.5; cursor: wait; }
  .panel button.secondary { background: transparent; color: #f0a; border: 1px solid #f0a; }

  .or { color: #666; text-align: center; margin: 10px 0; font-size: 12px; }
  .status { color: #f0a; font-size: 13px; margin-top: 10px; min-height: 18px; text-align: center; }
  .status.err { color: #f55; }

  #createForm { display: none; }
  #createForm.active { display: block; }
</style>
</head>
<body>

<div id="hud">
  <div id="crosshair"></div>
  <div id="roominfo" style="display:none;">
    <div class="title">🐱 <span id="roomName">—</span></div>
    <div>Код: <span class="code" id="roomCode">----</span></div>
  </div>
  <div id="players" style="display:none;">
    <div class="title">Игроки <span id="playerCount">1</span>/10</div>
    <div id="playerList"></div>
  </div>
  <div id="chatlog"></div>
  <input id="chatinput" type="text" maxlength="200" placeholder="Сообщение... Enter — отправить, Esc — отмена">
  <div id="music" style="display:none;">
    <div class="title">🎵 Музыка</div>
    <div class="now" id="musicNow">— ничего —</div>
    <button id="musicPick">Загрузить MP3</button>
    <button id="musicStop">Стоп</button>
    <input type="file" id="musicFile" accept="audio/*" style="display:none;">
  </div>
  <div id="emotePanel" style="display:none;">
    <button data-emote="sit">🐱 Сидеть (E)</button>
    <button data-emote="lay">😴 Лежать (Q)</button>
    <button data-emote="wave">👋 Махать (F)</button>
    <button data-emote="meow">🔊 Мяу (1)</button>
    <button data-emote="meow2">🔊 Мяу2 (2)</button>
    <button data-emote="meow3">🔊 Мурр (3)</button>
  </div>
  <div id="hint" style="display:none;">
    <b>WASD</b> ходьба · <b>Shift</b> бег · <b>Space</b> прыжок · <b>/</b> чат · <b>U</b> музыка · <b>E/Q/F</b> эмоции · <b>1-3</b> мяу
  </div>
</div>

<div id="menu">
  <h1>🐱 Котость Hangout</h1>
  <div class="sub">сетевая тусовка котов · до 10 в комнате</div>

  <div class="panel">
    <h2>🎮 Играть</h2>
    <input type="text" id="nameInput" placeholder="Твоё имя" maxlength="16">
    <button id="createBtn">✨ Создать комнату</button>
    <div id="createForm">
      <input type="text" id="serverNameInput" placeholder="Название комнаты" maxlength="30">
      <button id="createConfirm">🚀 Запустить</button>
      <button id="createCancel" class="secondary">Отмена</button>
    </div>
    <div class="or">— или по коду —</div>
    <input type="text" id="joinInput" class="code" placeholder="КОД" maxlength="6">
    <button id="joinBtn">🔗 Подключиться</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

console.log('🚀 Котость Hangout запускается...');

// ============================================================
//  КОНСТАНТЫ
// ============================================================
const MAX_PLAYERS = 10;
const MOVE_SPEED = 5;
const RUN_SPEED = 9;
const JUMP_VEL = 7;
const GRAVITY = -20;
const TICK_RATE = 20;
const CHAT_HISTORY = 60;
const ROOM_PREFIX = 'kotost-v4-';
const MODEL_URL = './kot.glb';

// STUN + TURN для надежного P2P
const ICE_CONFIG = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun2.l.google.com:19302' },
    { urls: 'stun:stun3.l.google.com:19302' },
    // Бесплатный TURN от Metered — помогает при строгом NAT
    {
      urls: 'turn:openrelay.metered.ca:80',
      username: 'openrelayproject',
      credential: 'openrelayproject'
    },
    {
      urls: 'turn:openrelay.metered.ca:443',
      username: 'openrelayproject',
      credential: 'openrelayproject'
    }
  ]
};

// Конфиг PeerJS — используем 1.peerjs.com (стабильнее чем 0.peerjs.com)
const PEER_CONFIG = {
  host: '1.peerjs.com',
  port: 443,
  secure: true,
  path: '/',
  config: ICE_CONFIG,
  debug: 1
};

// ============================================================
//  СОСТОЯНИЕ
// ============================================================
const state = {
  name: '',
  roomCode: '',
  roomName: '',
  isHost: false,
  peer: null,
  connections: new Map(),
  myId: null,
  catModel: null,
  player: {
    pos: new THREE.Vector3(0, 1.7, 0),
    vel: new THREE.Vector3(),
    yaw: 0,
    pitch: 0,
    onGround: true,
    lastSent: 0,
    emote: null
  },
  keys: {},
  chatActive: false,
  lastStep: 0
};

// ============================================================
//  ЗВУКИ
// ============================================================
const Sound = {
  ctx: null,
  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      console.log('🔊 AudioContext создан');
    } catch(e) { console.warn('Audio fail', e); }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  meow(pitch = 1) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(600 * pitch, t);
    o.frequency.exponentialRampToValueAtTime(900 * pitch, t + 0.1);
    o.frequency.exponentialRampToValueAtTime(500 * pitch, t + 0.3);
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 1200 * pitch; f.Q.value = 3;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.2, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    o.connect(f).connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t + 0.4);
  },
  purr() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = 'triangle';
    o.frequency.value = 25;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.15, t + 0.2);
    g.gain.setValueAtTime(0.15, t + 0.8);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
    o.connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t + 1.3);
  }
};

// ============================================================
//  THREE.JS
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b8e8);
scene.fog = new THREE.Fog(0x87b8e8, 60, 180);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xaabbdd, 0.55));
scene.add(new THREE.HemisphereLight(0x87b8e8, 0x4a5a3a, 0.7));

const sun = new THREE.DirectionalLight(0xfff2cc, 1.3);
sun.position.set(40, 60, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
sun.shadow.camera.far = 150;
scene.add(sun);

// ============================================================
//  ТЕКСТУРЫ
// ============================================================
function makeTex(base, opts = {}) {
  const noise = opts.noise || 25;
  const size = opts.size || 256;
  const pattern = opts.pattern || null;
  const repeat = opts.repeat || [1,1];
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = base; ctx.fillRect(0,0,size,size);
  const img = ctx.getImageData(0,0,size,size);
  for (let i=0; i<img.data.length; i+=4) {
    const n = (Math.random()-0.5)*noise;
    img.data[i] = Math.max(0,Math.min(255,img.data[i]+n));
    img.data[i+1] = Math.max(0,Math.min(255,img.data[i+1]+n));
    img.data[i+2] = Math.max(0,Math.min(255,img.data[i+2]+n));
  }
  ctx.putImageData(img,0,0);
  if (pattern === 'grass') {
    for (let i = 0; i < 400; i++) {
      ctx.strokeStyle = `rgba(${40+Math.random()*40},${100+Math.random()*80},${30+Math.random()*30},0.4)`;
      ctx.lineWidth = 1;
      const x = Math.random()*size, y = Math.random()*size;
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.lineTo(x + (Math.random()-0.5)*4, y - 3 - Math.random()*4); ctx.stroke();
    }
  } else if (pattern === 'wood') {
    for (let i = 0; i < 20; i++) {
      ctx.strokeStyle = `rgba(60,30,10,${0.15+Math.random()*0.25})`;
      ctx.lineWidth = 1 + Math.random()*2;
      ctx.beginPath();
      const y = Math.random()*size;
      ctx.moveTo(0, y);
      ctx.bezierCurveTo(size/3, y+(Math.random()-0.5)*20, 2*size/3, y+(Math.random()-0.5)*20, size, y);
      ctx.stroke();
    }
  } else if (pattern === 'brick') {
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 2;
    const bw = size/4, bh = size/8;
    for (let y = 0; y < size; y += bh) {
      const off = (y/bh)%2 ? bw/2 : 0;
      for (let x = -bw; x < size+bw; x += bw) ctx.strokeRect(x+off, y, bw, bh);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeat[0], repeat[1]);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const grassTex = makeTex('#4a7a3a', { pattern: 'grass', noise: 30, repeat: [25, 25] });
const woodTex  = makeTex('#8a5a30', { pattern: 'wood', noise: 25, repeat: [2, 2] });
const brickTex = makeTex('#a05040', { pattern: 'brick', noise: 20, repeat: [2, 2] });
const roofTex  = makeTex('#6a3a1a', { pattern: 'wood', noise: 30, repeat: [3, 3] });
const stoneTex = makeTex('#888888', { noise: 25, repeat: [2, 2] });

const grassMat = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.95 });
const woodMat  = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.8 });
const brickMat = new THREE.MeshStandardMaterial({ map: brickTex, roughness: 0.9 });
const roofMat  = new THREE.MeshStandardMaterial({ map: roofTex, roughness: 0.9 });
const stoneMat = new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.9 });

// ============================================================
//  МИР
// ============================================================
const world = new THREE.Group();
scene.add(world);

const collidables = [];

function addBox(x, y, z, w, h, d, mat, collide = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  world.add(m);
  if (collide) {
    collidables.push({
      min: new THREE.Vector3(x-w/2, y-h/2, z-d/2),
      max: new THREE.Vector3(x+w/2, y+h/2, z+d/2)
    });
  }
  return m;
}

const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), grassMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
world.add(ground);

for (let i = -50; i <= 50; i += 5) {
  addBox(i, 0.6, -50, 0.3, 1.2, 0.3, woodMat);
  addBox(i, 0.6,  50, 0.3, 1.2, 0.3, woodMat);
  addBox(-50, 0.6, i, 0.3, 1.2, 0.3, woodMat);
  addBox( 50, 0.6, i, 0.3, 1.2, 0.3, woodMat);
}

function buildHouse(cx, cz, w, d, h) {
  addBox(cx, h/2, cz - d/2, w, h, 0.4, brickMat);
  addBox(cx, h/2, cz + d/2, w, h, 0.4, brickMat);
  addBox(cx - w/2, h/2, cz, 0.4, h, d, brickMat);
  addBox(cx + w/2, h/2, cz, 0.4, h, d, brickMat);
  addBox(cx, h + 0.8, cz, w+1, 1.6, d+1, roofMat);
  const floor = new THREE.Mesh(new THREE.BoxGeometry(w-0.8, 0.1, d-0.8), woodMat);
  floor.position.set(cx, 0.05, cz);
  floor.receiveShadow = true;
  world.add(floor);
}
buildHouse(-25, -20, 6, 6, 4);
buildHouse( 25, -20, 6, 6, 4);
buildHouse( 25,  20, 6, 6, 4);
buildHouse(-25,  20, 6, 6, 4);

function buildTree(x, z) {
  addBox(x, 1, z, 0.5, 2, 0.5, woodMat);
  const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2a5a2a, roughness: 1 });
  for (let i = 0; i < 3; i++) {
    const s = 2 - i * 0.4;
    const leaves = new THREE.Mesh(new THREE.SphereGeometry(s, 8, 6), leavesMat);
    leaves.position.set(x, 2.5 + i * 1.3, z);
    leaves.castShadow = true;
    world.add(leaves);
  }
}
for (let i = 0; i < 20; i++) {
  const a = (i / 20) * Math.PI * 2;
  const r = 38 + Math.random() * 6;
  buildTree(Math.cos(a)*r, Math.sin(a)*r);
}

const fireGroup = new THREE.Group();
world.add(fireGroup);

for (let i = 0; i < 8; i++) {
  const a = (i/8) * Math.PI * 2;
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.4 + Math.random()*0.2),
    stoneMat
  );
  rock.position.set(Math.cos(a)*1.2, 0.2, Math.sin(a)*1.2);
  rock.castShadow = true;
  fireGroup.add(rock);
}
for (let i = 0; i < 4; i++) {
  const a = (i/4) * Math.PI * 2;
  const log = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.2, 8), woodMat);
  log.rotation.z = Math.PI/2;
  log.rotation.y = a;
  log.position.set(0, 0.2, 0);
  fireGroup.add(log);
}
const fireLight = new THREE.PointLight(0xff6622, 2, 15);
fireLight.position.y = 1.5;
fireGroup.add(fireLight);

const flameMat = new THREE.MeshBasicMaterial({ color: 0xffaa22, transparent: true, opacity: 0.8 });
const flame = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.4, 8), flameMat);
flame.position.y = 0.9;
fireGroup.add(flame);

function buildBench(x, z, rot) {
  const g = new THREE.Group();
  const seat = new THREE.Mesh(new THREE.BoxGeometry(3, 0.2, 0.6), woodMat);
  seat.position.y = 0.6; seat.castShadow = true;
  g.add(seat);
  const back = new THREE.Mesh(new THREE.BoxGeometry(3, 0.8, 0.15), woodMat);
  back.position.set(0, 1.0, -0.25); back.castShadow = true;
  g.add(back);
  for (const dx of [-1.3, 1.3]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.6, 0.6), woodMat);
    leg.position.set(dx, 0.3, 0);
    g.add(leg);
  }
  g.position.set(x, 0, z);
  g.rotation.y = rot;
  world.add(g);
}
buildBench(-8, -8, Math.PI/4);
buildBench( 8, -8, -Math.PI/4);
buildBench(-8,  8, Math.PI - Math.PI/4);
buildBench( 8,  8, Math.PI + Math.PI/4);

const cloudsGroup = new THREE.Group();
for (let i = 0; i < 20; i++) {
  const g = new THREE.Group();
  const n = 3 + Math.floor(Math.random()*3);
  for (let j = 0; j < n; j++) {
    const puff = new THREE.Mesh(
      new THREE.SphereGeometry(3 + Math.random()*3, 8, 6),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: 0.9 })
    );
    puff.position.set((Math.random()-0.5)*6, (Math.random()-0.5)*2, (Math.random()-0.5)*6);
    g.add(puff);
  }
  g.position.set((Math.random()-0.5)*180, 30 + Math.random()*15, (Math.random()-0.5)*180);
  cloudsGroup.add(g);
}
scene.add(cloudsGroup);

console.log('✅ Мир создан');

//  МОДЕЛЬ КОТА
// ============================================================
function fallbackCat() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.4, 0.9, 6, 12),
    new THREE.MeshStandardMaterial({ color: 0xcc8844, roughness: 0.8 })
  );
  body.position.y = 0.9;
  body.castShadow = true;
  g.add(body);
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 12, 12),
    new THREE.MeshStandardMaterial({ color: 0xcc8844, roughness: 0.8 })
  );
  head.position.y = 1.75;
  head.castShadow = true;
  g.add(head);
  for (const dx of [-0.18, 0.18]) {
    const ear = new THREE.Mesh(
      new THREE.ConeGeometry(0.12, 0.25, 4),
      new THREE.MeshStandardMaterial({ color: 0xcc8844 })
    );
    ear.position.set(dx, 2.05, 0);
    g.add(ear);
  }
  return g;
}

function normalizeModel(model) {
  const bbox = new THREE.Box3().setFromObject(model);
  const size = bbox.getSize(new THREE.Vector3());
  if (size.y === 0) return model;
  const scale = 1.8 / size.y;
  model.scale.setScalar(scale);

  const bbox2 = new THREE.Box3().setFromObject(model);
  const center = bbox2.getCenter(new THREE.Vector3());
  model.position.x -= center.x;
  model.position.z -= center.z;
  model.position.y -= bbox2.min.y;

  model.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
    }
  });
  return model;
}

let modelReady = false;

function initCatModel() {
  return new Promise((resolve) => {
    const loader = new GLTFLoader();
    loader.load(MODEL_URL,
      (gltf) => {
        state.catModel = normalizeModel(gltf.scene);
        modelReady = true;
        console.log('✅ kot.glb загружен');
        resolve();
      },
      undefined,
      (err) => {
        console.warn('⚠️ kot.glb не найден, используется fallback');
        state.catModel = normalizeModel(fallbackCat());
        modelReady = true;
        resolve();
      }
    );
  });
}

function makeNameSprite(text) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, 256, 64);
  ctx.strokeStyle = '#f0a';
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, 256, 64);
  ctx.font = 'bold 30px Segoe UI, Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ff88dd';
  ctx.fillText(text, 128, 34);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  sprite.scale.set(2.5, 0.6, 1);
  return sprite;
}

function makeCatInstance(name) {
  let instance;
  if (state.catModel) {
    instance = state.catModel.clone(true);
    instance.traverse(o => {
      if (o.isMesh && o.material) o.material = o.material.clone();
    });
  } else {
    instance = fallbackCat();
  }
  const label = makeNameSprite(name);
  label.position.y = 2.4;
  instance.add(label);
  return instance;
}

const $ = id => document.getElementById(id);
const menuEl = $('menu');
const statusEl = $('status');

function setStatus(t, err) {
  statusEl.textContent = t;
  statusEl.classList.toggle('err', !!err);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

// ============================================================
//  P2P
// ============================================================
function genRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function createRoom() {
  state.name = $('nameInput').value.trim().slice(0, 16) || 'Кот';
  state.roomName = $('serverNameInput').value.trim().slice(0, 30) || (state.name + 'а тусовка');
  state.isHost = true;
  state.roomCode = genRoomCode();
  setStatus('Создаём комнату...');

  const peerId = ROOM_PREFIX + state.roomCode;
  console.log('🎮 Создаю комнату:', peerId, 'через 1.peerjs.com');

  const peer = new Peer(peerId, PEER_CONFIG);
  let resolved = false;

  peer.on('open', (id) => {
    if (resolved) return;
    resolved = true;
    console.log('✅ Хост открыт:', id);
    state.peer = peer;
    state.myId = id;
    peer.on('connection', handleIncomingConnection);
    peer.on('error', (err) => console.warn('Host peer err:', err.type));
    onConnected('host');
  });

  peer.on('error', (err) => {
    console.error('❌ Ошибка создания:', err.type, err);
    if (resolved) return;
    try { peer.destroy(); } catch(e) {}
    setStatus('Ошибка: ' + err.type + '. Попробуй ещё раз.', true);
  });

  peer.on('disconnected', () => {
    console.log('🔌 Peer отключился, переподключаемся...');
    try { peer.reconnect(); } catch(e) {}
  });
}

function handleIncomingConnection(conn) {
  console.log('📥 Входящее соединение от', conn.peer);
  if (state.connections.size >= MAX_PLAYERS - 1) {
    conn.on('open', () => {
      conn.send({ type: 'kick', reason: 'Комната заполнена' });
      setTimeout(() => conn.close(), 500);
    });
    return;
  }
  setupConnection(conn);
}

function joinByCode(code) {
  state.name = $('nameInput').value.trim().slice(0, 16) || 'Кот';
  state.isHost = false;
  state.roomCode = code.toUpperCase();
  setStatus('Подключаемся...');
  console.log('🔗 Подключаюсь к:', ROOM_PREFIX + state.roomCode);

  const peer = new Peer(PEER_CONFIG);
  let resolved = false;

  peer.on('open', (id) => {
    console.log('✅ Мой peer открыт:', id);
    state.peer = peer;
    state.myId = id;

    const conn = peer.connect(ROOM_PREFIX + state.roomCode, { reliable: true });
    setupConnection(conn);

    const timeout = setTimeout(() => {
      if (!conn.open && !resolved) {
        setStatus('Таймаут подключения. Комната не найдена?', true);
        try { peer.destroy(); } catch(e) {}
      }
    }, 15000);

    conn.on('open', () => {
      resolved = true;
      clearTimeout(timeout);
      console.log('✅ Соединение установлено');
      onConnected('client');
    });
  });

  peer.on('error', (err) => {
    console.error('❌ Ошибка:', err.type, err);
    if (resolved) return;
    if (err.type === 'peer-unavailable') {
      setStatus('Комната не найдена', true);
    } else {
      setStatus('Ошибка: ' + err.type, true);
    }
    try { peer.destroy(); } catch(e) {}
  });

  peer.on('disconnected', () => {
    console.log('🔌 Peer отключился, переподключаемся...');
    try { peer.reconnect(); } catch(e) {}
  });
}

function setupConnection(conn) {
  conn.on('open', () => {
    console.log('✅ Conn открыт с', conn.peer);
    state.connections.set(conn.peer, { conn, data: null, mesh: null });
    conn.send({ type: 'hello', name: state.name });

    if (state.isHost) {
      const list = [{ id: state.myId, name: state.name }];
      for (const [pid, c] of state.connections) {
        if (c.data && pid !== conn.peer) list.push({ id: pid, name: c.data.name });
      }
      conn.send({ type: 'players', list });
    }

    updatePlayerList();
    addChat('sys', '🐾 Кот присоединился');
  });

  conn.on('data', (data) => handleData(conn.peer, data));

  conn.on('close', () => {
    console.log('❌ Conn закрыт с', conn.peer);
    const c = state.connections.get(conn.peer);
    if (c && c.mesh) scene.remove(c.mesh);
    state.connections.delete(conn.peer);

    if (state.isHost) {
      for (const [, cc] of state.connections) {
        try { cc.conn.send({ type: 'player-left', id: conn.peer }); } catch(e) {}
      }
    }
    updatePlayerList();
    addChat('sys', '💤 Кот ушёл');
  });

  conn.on('error', (e) => console.warn('Conn error:', e));
}

function handleData(fromId, data) {
  if (!data || typeof data !== 'object') return;
  const c = state.connections.get(fromId);

  switch (data.type) {
    case 'hello':
      if (c) { c.data = c.data || {}; c.data.name = data.name || 'Кот'; }
      updatePlayerList();
      break;
    case 'players':
      for (const p of data.list) {
        if (p.id === state.myId) continue;
        const ex = state.connections.get(p.id);
        if (ex) { ex.data = ex.data || {}; ex.data.name = p.name; }
      }
      updatePlayerList();
      break;
    case 'player-left':
      if (c && c.mesh) scene.remove(c.mesh);
      state.connections.delete(fromId);
      updatePlayerList();
      break;
    case 'pos':
      if (c) {
        c.data = c.data || {};
        c.data.x = data.x; c.data.y = data.y; c.data.z = data.z;
        c.data.ry = data.ry;
        c.data.emote = data.emote;
        c.data.name = c.data.name || data.name || 'Кот';

        if (!c.mesh && modelReady) {
          c.mesh = makeCatInstance(c.data.name);
          scene.add(c.mesh);
        }
        if (c.mesh) {
          c.mesh.position.set(data.x, data.y - 1.7, data.z);
          c.mesh.rotation.y = data.ry;
          if (data.emote === 'sit') c.mesh.rotation.x = -0.3;
          else if (data.emote === 'lay') { c.mesh.rotation.x = -1.3; }
          else c.mesh.rotation.x = 0;
        }
      }
      break;
    case 'chat':
      addChat(data.name || '???', data.text, false);
      if (state.isHost) {
        for (const [pid, cc] of state.connections) {
          if (pid !== fromId) try { cc.conn.send(data); } catch(e) {}
        }
      }
      break;
    case 'emote':
      if (c) { c.data = c.data || {}; c.data.emote = data.emote; }
      break;
    case 'kick':
      alert('Кикнули: ' + (data.reason || ''));
      location.reload();
      break;
  }
}

function onConnected(role) {
  console.log('🎉 Подключено как:', role);
  menuEl.classList.add('hidden');
  $('roominfo').style.display = 'block';
  $('players').style.display = 'block';
  $('music').style.display = 'block';
  $('emotePanel').style.display = 'flex';
  $('hint').style.display = 'block';
  $('roomName').textContent = state.roomName || ('Комната ' + state.roomCode);
  $('roomCode').textContent = state.roomCode;

  addChat('sys', `🐱 Добро пожаловать в ${state.roomName || state.roomCode}!`);
  addChat('sys', 'Жми / для чата, U для музыки');

  updatePlayerList();
  setTimeout(() => {
    try { renderer.domElement.requestPointerLock(); } catch(e) {}
  }, 100);
}

$('roomCode').addEventListener('click', () => {
  navigator.clipboard.writeText(state.roomCode);
  addChat('sys', 'Код скопирован: ' + state.roomCode);
});

function updatePlayerList() {
  const list = $('playerList');
  list.innerHTML = '';
  const me = document.createElement('div');
  me.className = 'p me';
  me.textContent = state.name + (state.isHost ? ' 👑' : '');
  list.appendChild(me);
  for (const [pid, c] of state.connections) {
    const d = document.createElement('div');
    d.className = 'p';
    d.textContent = (c.data && c.data.name) || 'Подключение...';
    list.appendChild(d);
  }
  $('playerCount').textContent = state.connections.size + 1;
}

// ============================================================
//  ЧАТ
// ============================================================
const chatlog = $('chatlog');
const chatInput = $('chatinput');

function addChat(name, text, isSystem) {
  const d = document.createElement('div');
  if (isSystem || name === 'sys') {
    d.className = 'sys';
    d.textContent = text;
  } else {
    d.innerHTML = `<span class="name">${escapeHtml(name)}:</span>${escapeHtml(text)}`;
  }
  chatlog.appendChild(d);
  chatlog.scrollTop = chatlog.scrollHeight;
  while (chatlog.children.length > CHAT_HISTORY) chatlog.removeChild(chatlog.firstChild);
}

function openChat() {
  if (state.chatActive) return;
  state.chatActive = true;
  chatInput.classList.add('active');
  chatInput.value = '';
  chatInput.focus();
  document.exitPointerLock();
}

function closeChat(send) {
  if (!state.chatActive) return;
  state.chatActive = false;
  chatInput.classList.remove('active');
  if (send) {
    const text = chatInput.value.trim();
    if (text) sendChat(text);
  }
  chatInput.value = '';
  try { renderer.domElement.requestPointerLock(); } catch(e) {}
}

function sendChat(text) {
  const payload = { type: 'chat', name: state.name, text };
  addChat(state.name, text, false);
  for (const [, c] of state.connections) {
    try { c.conn.send(payload); } catch(e) {}
  }
}

let musicAudio = null;
$('musicPick').addEventListener('click', () => $('musicFile').click());
$('musicStop').addEventListener('click', () => {
  if (musicAudio) { musicAudio.pause(); musicAudio = null; $('musicNow').textContent = '— ничего —'; }
});
$('musicFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (musicAudio) musicAudio.pause();
  musicAudio = new Audio(URL.createObjectURL(file));
  musicAudio.volume = 0.5;
  musicAudio.play();
  $('musicNow').textContent = '🎵 ' + file.name;
  addChat('sys', `Играет: ${file.name}`);
  musicAudio.onended = () => { $('musicNow').textContent = '— тишина —'; };
  e.target.value = '';
});

// ============================================================
//  ВВОД
// ============================================================
document.addEventListener('keydown', (e) => {
  if (state.chatActive) {
    if (e.key === 'Enter') { e.preventDefault(); closeChat(true); }
    else if (e.key === 'Escape') { e.preventDefault(); closeChat(false); }
    return;
  }
  if (!menuEl.classList.contains('hidden')) return;

  if (e.key === '/' || e.key === '.' || e.key === 'ж' || e.key === 'Ж') {
    e.preventDefault(); openChat(); return;
  }
  if (e.key === 'u' || e.key === 'U' || e.key === 'г' || e.key === 'Г') {
    $('musicFile').click(); return;
  }
  if (e.key === 'e' || e.key === 'E' || e.key === 'у' || e.key === 'У') { triggerEmote('sit'); return; }
  if (e.key === 'q' || e.key === 'Q' || e.key === 'й' || e.key === 'Й') { triggerEmote('lay'); return; }
  if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') { triggerEmote('wave'); return; }
  if (e.key === '1') { Sound.meow(1); triggerEmote('meow'); return; }
  if (e.key === '2') { Sound.meow(1.3); triggerEmote('meow2'); return; }
  if (e.key === '3') { Sound.purr(); triggerEmote('meow3'); return; }

  state.keys[e.code] = true;
});
document.addEventListener('keyup', (e) => { state.keys[e.code] = false; });

document.addEventListener('mousemove', (e) => {
  if (state.chatActive) return;
  if (document.pointerLockElement !== renderer.domElement) return;
  state.player.yaw -= e.movementX * 0.002;
  state.player.pitch -= e.movementY * 0.002;
  state.player.pitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, state.player.pitch));
});

document.addEventListener('click', () => {
  if (!state.chatActive && menuEl.classList.contains('hidden')) {
    if (document.pointerLockElement !== renderer.domElement) {
      try { renderer.domElement.requestPointerLock(); } catch(e) {}
    }
  }
});

document.querySelectorAll('#emotePanel button').forEach(b => {
  b.addEventListener('click', () => {
    const em = b.dataset.emote;
    if (em === 'meow') Sound.meow(1);
    else if (em === 'meow2') Sound.meow(1.3);
    else if (em === 'meow3') Sound.purr();
    triggerEmote(em);
  });
});

function triggerEmote(name) {
  state.player.emote = name;
  const payload = { type: 'emote', emote: name };
  for (const [, c] of state.connections) {
    try { c.conn.send(payload); } catch(e) {}
  }
}

// ============================================================
//  ДВИЖЕНИЕ
// ============================================================
const PLAYER_RADIUS = 0.5;

function checkCollision(x, y, z) {
  for (const c of collidables) {
    if (x + PLAYER_RADIUS > c.min.x && x - PLAYER_RADIUS < c.max.x &&
        y + 1.6 > c.min.y && y - 0.2 < c.max.y &&
        z + PLAYER_RADIUS > c.min.z && z - PLAYER_RADIUS < c.max.z) return true;
  }
  return false;
}

function updatePlayer(dt) {
  const p = state.player;
  camera.rotation.y = p.yaw;
  camera.rotation.x = p.pitch;

  const speed = (state.keys['ShiftLeft'] || state.keys['ShiftRight']) ? RUN_SPEED : MOVE_SPEED;
  const forward = new THREE.Vector3(-Math.sin(p.yaw), 0, -Math.cos(p.yaw));
  const right = new THREE.Vector3(Math.cos(p.yaw), 0, -Math.sin(p.yaw));

  const dir = new THREE.Vector3();
  if (state.keys['KeyW']) dir.add(forward);
  if (state.keys['KeyS']) dir.sub(forward);
  if (state.keys['KeyD']) dir.add(right);
  if (state.keys['KeyA']) dir.sub(right);

  if (dir.lengthSq() > 0) {
    dir.normalize().multiplyScalar(speed * dt);
    const nx = p.pos.x + dir.x, nz = p.pos.z + dir.z;
    if (!checkCollision(nx, p.pos.y, p.pos.z)) p.pos.x = nx;
    if (!checkCollision(p.pos.x, p.pos.y, nz)) p.pos.z = nz;
    const now = performance.now();
    if (now - state.lastStep > (speed > 6 ? 300 : 450)) state.lastStep = now;
  }

  p.vel.y += GRAVITY * dt;
  if (state.keys['Space'] && p.onGround) { p.vel.y = JUMP_VEL; p.onGround = false; }
  p.pos.y += p.vel.y * dt;

  if (p.pos.y <= 1.7) { p.pos.y = 1.7; p.vel.y = 0; p.onGround = true; }

  p.pos.x = Math.max(-48, Math.min(48, p.pos.x));
  p.pos.z = Math.max(-48, Math.min(48, p.pos.z));

  camera.position.copy(p.pos);

  const now = performance.now();
  if (now - p.lastSent > 1000 / TICK_RATE) {
    p.lastSent = now;
    sendPosition();
  }
}

function sendPosition() {
  if (!state.peer) return;
  const p = state.player;
  const payload = {
    type: 'pos',
    x: p.pos.x, y: p.pos.y, z: p.pos.z,
    ry: p.yaw, emote: p.emote, name: state.name
  };
  for (const [, c] of state.connections) {
    try { c.conn.send(payload); } catch(e) {}
  }
}

// ============================================================
//  АНИМАЦИЯ
// ============================================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = performance.now() * 0.001;

  if (menuEl.classList.contains('hidden') && !state.chatActive) {
    updatePlayer(dt);
  }

  flame.scale.y = 0.8 + Math.sin(t * 8) * 0.2;
  flame.scale.x = 0.9 + Math.sin(t * 6 + 1) * 0.1;
  flame.scale.z = 0.9 + Math.cos(t * 7 + 2) * 0.1;
  fireLight.intensity = 1.6 + Math.sin(t * 10) * 0.6;
  fireLight.position.x = Math.sin(t * 5) * 0.15;
  fireLight.position.z = Math.cos(t * 4) * 0.15;

  cloudsGroup.children.forEach((c, i) => {
    c.position.x += dt * (0.5 + (i % 3) * 0.2);
    if (c.position.x > 120) c.position.x = -120;
  });

  for (const [, c] of state.connections) {
    if (c.mesh && c.data) {
      const target = new THREE.Vector3(c.data.x, c.data.y - 1.7, c.data.z);
      c.mesh.position.lerp(target, Math.min(1, dt * 15));
      let dy = c.data.ry - c.mesh.rotation.y;
      while (dy > Math.PI) dy -= Math.PI * 2;
      while (dy < -Math.PI) dy += Math.PI * 2;
      c.mesh.rotation.y += dy * Math.min(1, dt * 15);
    }
  }

  renderer.render(scene, camera);
}
animate();
