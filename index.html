<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ipcnei — чат</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBraasdins+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>
/* ── THEMES ── */
:root[data-theme="dark"]{
  --bg:#0a0a0f;
  --bg2:#12121a;
  --bg3:#1a1a24;
  --surface:rgba(255,255,255,.03);
  --border:rgba(255,255,255,.08);
  --text:#f0f0f5;
  --muted:#8b8b9e;
  --accent:#00e5ff;
  --accent2:#b14aff;
  --msg-own:#00e5ff;
  --msg-own-text:#0a0a0f;
  --msg-other:#1a1a24;
  --msg-other-text:#f0f0f5;
  --glow:0 0 20px rgba(0,229,255,.5);
}
:root[data-theme="light"]{
  --bg:#f5f5f8;
  --bg2:#ffffff;
  --bg3:#ebebf0;
  --surface:rgba(0,0,0,.03);
  --border:rgba(0,0,0,.08);
  --text:#0a0a0f;
  --muted:#666677;
  --accent:#0099cc;
  --accent2:#7a2ee6;
  --msg-own:#0099cc;
  --msg-own-text:#ffffff;
  --msg-other:#ebebf0;
  --msg-other-text:#0a0a0f;
  --glow:0 0 20px rgba(0,153,204,.4);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:background .3s,color .3s;
  overflow:hidden;
}
input,button,textarea{font-family:inherit}

/* ── AUTH SCREEN ── */
.auth-screen{
  position:fixed;inset:0;
  display:grid;place-items:center;
  padding:20px;
  background:radial-gradient(circle at 20% 20%,rgba(0,229,255,.08),transparent 50%),
             radial-gradient(circle at 80% 80%,rgba(177,74,255,.08),transparent 50%),
             var(--bg);
  z-index:100;
}
.auth-card{
  width:100%;max-width:400px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:20px;
  padding:36px 32px;
  box-shadow:0 30px 80px rgba(0,0,0,.4), var(--glow);
}
.auth-logo{
  font-size:2rem;font-weight:900;
  text-align:center;margin-bottom:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:-.03em;
}
.auth-sub{
  text-align:center;color:var(--muted);
  font-size:.85rem;margin-bottom:28px;
}
.auth-tabs{
  display:flex;gap:4px;margin-bottom:24px;
  background:var(--bg3);padding:4px;border-radius:12px;
}
.auth-tab{
  flex:1;padding:10px;border:none;background:transparent;
  color:var(--muted);font-weight:600;font-size:.85rem;
  border-radius:8px;cursor:pointer;transition:.2s;
}
.auth-tab.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;box-shadow:var(--glow);
}
.auth-form{display:none}
.auth-form.active{display:block}
.auth-form label{
  display:block;font-size:.78rem;color:var(--muted);
  margin-bottom:6px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;
}
.auth-form input{
  width:100%;padding:12px 14px;
  border-radius:10px;border:1px solid var(--border);
  background:var(--bg3);color:var(--text);
  font-size:.95rem;margin-bottom:14px;
  transition:.2s;
}
.auth-form input:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(0,229,255,.15);
}
.auth-form button[type=submit]{
  width:100%;padding:13px;
  border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-weight:700;font-size:.95rem;
  cursor:pointer;transition:.2s;
  box-shadow:var(--glow);
  margin-top:8px;
}
.auth-form button[type=submit]:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(0,229,255,.5);
}
.auth-form button[type=submit]:disabled{
  opacity:.5;cursor:not-allowed;transform:none;
}
.auth-switch{
  text-align:center;margin-top:20px;
  font-size:.85rem;color:var(--muted);
}
.auth-switch a{
  color:var(--accent);font-weight:600;
  text-decoration:none;cursor:pointer;
}
.auth-switch a:hover{text-decoration:underline}
.auth-error{
  background:rgba(255,60,60,.1);
  border:1px solid rgba(255,60,60,.3);
  color:#ff8080;
  padding:10px;border-radius:8px;
  font-size:.85rem;margin-bottom:14px;
  text-align:center;display:none;
}
.auth-error.show{display:block}
.g-recaptcha{margin-bottom:14px;transform:scale(.9);transform-origin:0 0}

/* ── CHAT SCREEN ── */
.chat-screen{
  display:none;height:100vh;
  flex-direction:column;
}
.chat-screen.active{display:flex}

.chat-header{
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
}
.chat-logo{
  font-size:1.2rem;font-weight:900;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.chat-user{
  display:flex;align-items:center;gap:10px;
  font-size:.85rem;color:var(--muted);
}
.chat-user b{color:var(--text);font-weight:700}
.btn-logout{
  padding:6px 14px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);
  border-radius:8px;font-size:.78rem;font-weight:600;
  cursor:pointer;transition:.2s;
}
.btn-logout:hover{
  border-color:var(--accent);color:var(--accent);
}

.chat-messages{
  flex:1;overflow-y:auto;
  padding:20px;
  display:flex;flex-direction:column;gap:14px;
  background:radial-gradient(circle at 50% 0%,rgba(0,229,255,.03),transparent 50%),
             var(--bg);
}
.chat-messages::-webkit-scrollbar{width:8px}
.chat-messages::-webkit-scrollbar-track{background:transparent}
.chat-messages::-webkit-scrollbar-thumb{
  background:var(--border);border-radius:4px;
}
.chat-messages::-webkit-scrollbar-thumb:hover{background:var(--muted)}

.msg{
  display:flex;gap:10px;max-width:75%;
  animation:msgIn .3s ease;
}
@keyframes msgIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
.msg.own{align-self:flex-end;flex-direction:row-reverse}
.msg-avatar{
  width:36px;height:36px;border-radius:50%;
  flex-shrink:0;
  display:grid;place-items:center;
  font-weight:800;font-size:.85rem;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}
.msg-bubble{
  padding:10px 14px;border-radius:16px;
  background:var(--msg-other);
  color:var(--msg-other-text);
  font-size:.92rem;line-height:1.5;
  word-wrap:break-word;position:relative;
}
.msg.own .msg-bubble{
  background:var(--msg-own);
  color:var(--msg-own-text);
  box-shadow:var(--glow);
}
.msg-meta{
  display:flex;gap:8px;font-size:.7rem;
  color:var(--muted);margin-bottom:4px;
  font-weight:600;
}
.msg.own .msg-meta{color:rgba(10,10,15,.7);justify-content:flex-end}

.chat-input-wrap{
  background:var(--bg2);
  border-top:1px solid var(--border);
  padding:14px 20px;
  display:flex;gap:10px;
  position:relative;
}
.chat-input{
  flex:1;padding:12px 16px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--bg3);
  color:var(--text);
  font-size:.95rem;
  resize:none;
  min-height:44px;max-height:120px;
  transition:.2s;
}
.chat-input:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(0,229,255,.15);
}
.chat-send{
  padding:0 22px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-weight:700;font-size:.9rem;
  cursor:pointer;transition:.2s;
  box-shadow:var(--glow);
}
.chat-send:hover{transform:translateY(-2px)}
.chat-send:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ── THEME TOGGLE ── */
.theme-toggle{
  position:fixed;left:20px;bottom:20px;
  width:52px;height:52px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--bg2);
  color:var(--text);
  font-size:1.3rem;
  cursor:pointer;
  display:grid;place-items:center;
  box-shadow:0 10px 30px rgba(0,0,0,.3), var(--glow);
  transition:.3s;
  z-index:1000;
}
.theme-toggle:hover{transform:scale(1.1) rotate(15deg)}
.theme-toggle:active{transform:scale(.95)}
</style>
</head>
<body data-theme="dark">

<!-- ═══════════ AUTH SCREEN ═══════════ -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">ipcnei</div>
    <div class="auth-sub">приватный чат</div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Вход</button>
      <button class="auth-tab" data-tab="register">Регистрация</button>
    </div>

    <div class="auth-error" id="authError"></div>

    <!-- LOGIN -->
    <form class="auth-form active" id="loginForm">
      <label>Ник</label>
      <input type="text" id="loginUser" required autocomplete="username">
      <label>Пароль</label>
      <input type="password" id="loginPass" required autocomplete="current-password">
      <div class="g-recaptcha" data-sitekey="6LfsQb8tAAAAAHpYMvlv5Txe1SES0uuRQZXw_3tM"></div>
      <button type="submit" id="loginBtn">Войти</button>
      <div class="auth-switch">
        Нет аккаунта? <a onclick="switchTab('register')">Зарегистрироваться</a>
      </div>
    </form>

    <!-- REGISTER -->
    <form class="auth-form" id="registerForm">
      <label>Ник</label>
      <input type="text" id="regUser" required pattern="[a-zA-Z0-9_]{3,20}" autocomplete="username">
      <label>Пароль</label>
      <input type="password" id="regPass" required minlength="6" autocomplete="new-password">
      <label>Повтори пароль</label>
      <input type="password" id="regPass2" required minlength="6" autocomplete="new-password">
      <div class="g-recaptcha" data-sitekey="6LfsQb8tAAAAAHpYMvlv5Txe1SES0uuRQZXw_3tM"></div>
      <button type="submit" id="registerBtn">Зарегистрироваться</button>
      <div class="auth-switch">
        Уже есть аккаунт? <a onclick="switchTab('login')">Войти</a>
      </div>
    </form>
  </div>
</div>

<!-- ═══════════ CHAT SCREEN ═══════════ -->
<div class="chat-screen" id="chatScreen">
  <div class="chat-header">
    <div class="chat-logo">ipcnei</div>
    <div class="chat-user">
      <span>Ты: <b id="currentUser">—</b></span>
      <button class="btn-logout" onclick="logout()">Выйти</button>
    </div>
  </div>

  <div class="chat-messages" id="messages"></div>

  <div class="chat-input-wrap">
    <textarea class="chat-input" id="msgInput" placeholder="Напиши сообщение..." rows="1"></textarea>
    <button class="chat-send" id="sendBtn">Отправить</button>
  </div>
</div>

<!-- THEME TOGGLE -->
<button class="theme-toggle" id="themeToggle" title="Сменить тему">🌙</button>

<script>
// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
var API = '/api';
var currentUser = null;
var lastMsgCount = 0;

// ═══════════════════════════════════════════
// THEME
// ═══════════════════════════════════════════
var themeToggle = document.getElementById('themeToggle');
var savedTheme = localStorage.getItem('ipcnei_theme') || 'dark';
document.body.setAttribute('data-theme', savedTheme);
themeToggle.textContent = savedTheme === 'dark' ? '🌙' : '☀️';

themeToggle.addEventListener('click', function(){
  var cur = document.body.getAttribute('data-theme');
  var next = cur === 'dark' ? 'light' : 'dark';
  document.body.setAttribute('data-theme', next);
  localStorage.setItem('ipcnei_theme', next);
  themeToggle.textContent = next === 'dark' ? '🌙' : '☀️';
});

// ═══════════════════════════════════════════
// TAB SWITCH
// ═══════════════════════════════════════════
function switchTab(tab){
  document.querySelectorAll('.auth-tab').forEach(function(t){
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  document.getElementById('loginForm').classList.toggle('active', tab === 'login');
  document.getElementById('registerForm').classList.toggle('active', tab === 'register');
  hideError();
}

document.querySelectorAll('.auth-tab').forEach(function(t){
  t.addEventListener('click', function(){ switchTab(this.dataset.tab); });
});

// ═══════════════════════════════════════════
// ERROR
// ═══════════════════════════════════════════
function showError(msg){
  var e = document.getElementById('authError');
  e.textContent = msg;
  e.classList.add('show');
}
function hideError(){
  document.getElementById('authError').classList.remove('show');
}

// ═══════════════════════════════════════════
// RECAPTCHA
// ═══════════════════════════════════════════
function getRecaptcha(){
  // Виджет 1 (login) или виджет 2 (register)
  if (typeof grecaptcha === 'undefined') return null;
  var activeForm = document.querySelector('.auth-form.active');
  var widget = activeForm.querySelector('.g-recaptcha');
  if (!widget) return null;
  var widgetId = widget.getAttribute('data-widget-id');
  if (widgetId === null) return null;
  return grecaptcha.getResponse(parseInt(widgetId));
}

// Автоинициализация reCAPTCHA на обоих формах
window.onloadRecaptcha = function(){
  document.querySelectorAll('.g-recaptcha').forEach(function(el, i){
    var id = grecaptcha.render(el, {
      sitekey: el.getAttribute('data-sitekey'),
    });
    el.setAttribute('data-widget-id', id);
  });
};

// ═══════════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════════
document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  hideError();

  var username = document.getElementById('loginUser').value.trim();
  var password = document.getElementById('loginPass').value;
  var recaptcha = getRecaptcha();

  if (!recaptcha) { showError('Пройди капчу'); return; }

  var btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Вход...';

  try {
    var res = await fetch(API + '/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ username, password, recaptcha }),
    });
    var data = await res.json();

    if (!res.ok) {
      showError(data.error || 'Ошибка входа');
      btn.disabled = false; btn.textContent = 'Войти';
      if (typeof grecaptcha !== 'undefined') grecaptcha.reset();
      return;
    }

    enterChat(data.user);
  } catch (err) {
    showError('Ошибка сети: ' + err.message);
    btn.disabled = false; btn.textContent = 'Войти';
  }
});

// ═══════════════════════════════════════════
// REGISTER
// ═══════════════════════════════════════════
document.getElementById('registerForm').addEventListener('submit', async function(e){
  e.preventDefault();
  hideError();

  var username = document.getElementById('regUser').value.trim();
  var password = document.getElementById('regPass').value;
  var password2 = document.getElementById('regPass2').value;
  var recaptcha = getRecaptcha();

  if (password !== password2) { showError('Пароли не совпадают'); return; }
  if (!recaptcha) { showError('Пройди капчу'); return; }

  var btn = document.getElementById('registerBtn');
  btn.disabled = true; btn.textContent = 'Регистрация...';

  try {
    var res = await fetch(API + '/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ username, password, recaptcha }),
    });
    var data = await res.json();

    if (!res.ok) {
      showError(data.error || 'Ошибка регистрации');
      btn.disabled = false; btn.textContent = 'Зарегистрироваться';
      if (typeof grecaptcha !== 'undefined') grecaptcha.reset();
      return;
    }

    enterChat(data.user);
  } catch (err) {
    showError('Ошибка сети: ' + err.message);
    btn.disabled = false; btn.textContent = 'Зарегистрироваться';
  }
});

// ═══════════════════════════════════════════
// ENTER CHAT
// ═══════════════════════════════════════════
function enterChat(user){
  currentUser = user;
  localStorage.setItem('ipcnei_user', JSON.stringify(user));
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('chatScreen').classList.add('active');
  document.getElementById('currentUser').textContent = user.username;
  loadMessages();
  setInterval(loadMessages, 3000);
}

function logout(){
  localStorage.removeItem('ipcnei_user');
  location.reload();
}

// ═══════════════════════════════════════════
// LOAD MESSAGES
// ═══════════════════════════════════════════
async function loadMessages(){
  try {
    var res = await fetch(API + '/messages');
    var msgs = await res.json();
    if (!Array.isArray(msgs)) return;
    renderMessages(msgs);
  } catch (e) {}
}

function renderMessages(msgs){
  var box = document.getElementById('messages');
  var wasAtBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 100;

  if (msgs.length === lastMsgCount && box.children.length > 0) return;
  lastMsgCount = msgs.length;

  box.innerHTML = '';
  msgs.forEach(function(m){
    var isOwn = currentUser && m.username === currentUser.username;
    var time = new Date(m.created_at).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
    var initial = (m.username || '?')[0].toUpperCase();

    var div = document.createElement('div');
    div.className = 'msg' + (isOwn ? ' own' : '');
    div.innerHTML =
      '<div class="msg-avatar">' + initial + '</div>' +
      '<div>' +
        '<div class="msg-meta"><span>' + escapeHtml(m.username) + '</span><span>' + time + '</span></div>' +
        '<div class="msg-bubble">' + escapeHtml(m.text) + '</div>' +
      '</div>';
    box.appendChild(div);
  });

  if (wasAtBottom) box.scrollTop = box.scrollHeight;
}

function escapeHtml(s){
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ═══════════════════════════════════════════
// SEND MESSAGE
// ═══════════════════════════════════════════
var msgInput = document.getElementById('msgInput');
var sendBtn = document.getElementById('sendBtn');

sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

async function sendMessage(){
  var text = msgInput.value.trim();
  if (!text || !currentUser) return;

  sendBtn.disabled = true;
  msgInput.value = '';

  try {
    await fetch(API + '/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ user_id: currentUser.id, text: text }),
    });
    await loadMessages();
  } catch (e) {}

  sendBtn.disabled = false;
  msgInput.focus();
}

// ═══════════════════════════════════════════
// AUTO LOGIN
// ═══════════════════════════════════════════
(function autoLogin(){
  var saved = localStorage.getItem('ipcnei_user');
  if (saved) {
    try {
      var user = JSON.parse(saved);
      enterChat(user);
    } catch(e) {}
  }
})();
</script>

</body>
</html>
